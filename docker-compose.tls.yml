# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Use an existing certificate directory outside the repository.
services:
  nginx:
    environment:
      NGINX_TLS: 'true'
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?Set your certificate hostname}
    volumes:
      - ${TLS_CERT_DIR:?Set an absolute certificate directory}:/etc/nginx/tls:ro
    ports:
      - 127.0.0.1:80:8080
      - 127.0.0.1:443:8443
  ai-gateway:
    environment:
      PUBLIC_ORIGIN: https://${NGINX_SERVER_NAME:?Set your certificate hostname}
  payment-service:
    environment:
      PUBLIC_ORIGIN: https://${NGINX_SERVER_NAME:?Set your certificate hostname}
