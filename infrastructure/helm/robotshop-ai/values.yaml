image:
  repository: robotshop-ai
  tag: local
  pullPolicy: IfNotPresent
publicOrigin: http://localhost:3000
aiEnabled: false
# Pre-create a Secret containing OPENAI_API_KEY and OPENAI_MODEL to enable AI.
agentSecretName: ""
otelTracesEndpoint: ""
persistence:
  size: 1Gi
  storageClass: ""
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Secret holds PAYMENT_SERVICE_TOKEN and the three RAZORPAY_* settings.
paymentSecretName: ""
paymentMode: live

# External managed PostgreSQL; runtime role should have SELECT only on shipping tables.
shipping:
  image:
    repository: robotshop-shipping
    tag: local
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  databaseSecretName: ""
  migrationSecretName: ""

# Managed Redis/RabbitMQ with TLS. Credentials and endpoints come from an existing Secret.
integrations:
  enabled: true
  secretName: ""
