image:
  repository: robotshop-ai
  tag: local
  pullPolicy: IfNotPresent
publicOrigin: http://localhost:3000
aiEnabled: false
# Pre-create a Secret containing OPENAI_API_KEY and OPENAI_MODEL to enable AI.
agentSecretName: ""
otelTracesEndpoint: ""
persistence:
  size: 1Gi
  storageClass: ""
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Secret holds PAYMENT_SERVICE_TOKEN and the three RAZORPAY_* settings.
paymentSecretName: ""
paymentMode: live

# External managed PostgreSQL; runtime role needs SELECT on shipping tables and INSERT on shipment_requests.
shipping:
  image:
    repository: robotshop-shipping
    tag: local
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  databaseSecretName: ""
  # Owner credentials used by shipping itself during startup; no separate Job.
  migrationSecretName: ""

# Managed Redis/RabbitMQ with TLS. Credentials and endpoints come from an existing Secret.
integrations:
  enabled: true
  secretName: ""

nginx:
  enabled: true
  image:
    repository: robotshop-nginx
    tag: local
  replicas: 2
  serviceType: ClusterIP
  # Leave TLS termination to the cluster ingress/load balancer by default.
  tlsSecretName: ""
  serverName: localhost
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Existing Secret with MONGODB_URL; use verified TLS for remote MongoDB.
mongodb:
  secretName: ""
  database: robotshop
