apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-shipping-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: [node, services/shipping-service/migrate.mjs]
          env:
            - name: SHIPPING_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set shipping.migrationSecretName to an existing migration credentials Secret" .Values.shipping.migrationSecretName }}
                  key: SHIPPING_MIGRATION_DATABASE_URL
            - name: SHIPPING_DB_TLS
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
