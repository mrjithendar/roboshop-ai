{{- $root := . -}}
{{- $services := dict "ai-gateway" 3000 "product-ingestion" 4101 "recommendation-service" 4102 "shopping-agent" 4103 "sre-copilot" 4104 "payment-service" 4105 "shipping-service" 4106 -}}
{{- range $name, $port := $services }}
{{- $image := index $root.Values.serviceImages $name -}}
{{- if eq $name "shipping-service" }}{{- $image = $root.Values.shipping.image -}}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
spec:
  # The demo JSON ledger supports exactly one gateway writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ $name }}
          image: "{{ $image.repository }}:{{ $image.tag }}"
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $port }}
          env:
            {{- if or (eq $name "ai-gateway") (eq $name "product-ingestion") }}
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set mongodb.secretName for accounts and catalogue persistence" $root.Values.mongodb.secretName }}
                  key: MONGODB_URL
            - name: MONGODB_DATABASE
              value: {{ $root.Values.mongodb.database | quote }}
            {{- end }}
            {{- if eq $name "shipping-service" }}
            - name: CACHE_ENABLED
              value: {{ $root.Values.integrations.enabled | quote }}
            - name: MESSAGING_ENABLED
              value: {{ $root.Values.integrations.enabled | quote }}
            {{- if $root.Values.integrations.enabled }}
            {{- range $key := list "REDIS_HOST" "REDIS_PORT" "REDIS_USERNAME" "REDIS_PASSWORD" "RABBITMQ_HOST" "RABBITMQ_PORT" "RABBITMQ_USERNAME" "RABBITMQ_PASSWORD" "RABBITMQ_VHOST" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set integrations.secretName for external Redis and RabbitMQ" $root.Values.integrations.secretName }}
                  key: {{ $key }}
            {{- end }}
            - name: REDIS_TLS
              value: "true"
            - name: RABBITMQ_TLS
              value: "true"
            {{- end }}
            - name: SHIPPING_TRACING_ENABLED
              value: {{ ne $root.Values.otelTracesEndpoint "" | quote }}
            - name: SHIPPING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set shipping.databaseSecretName to an existing PostgreSQL credentials Secret" $root.Values.shipping.databaseSecretName }}
                  key: SHIPPING_DATABASE_URL
            - name: SHIPPING_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set shipping.migrationSecretName for shipping startup migrations" $root.Values.shipping.migrationSecretName }}
                  key: SHIPPING_MIGRATION_DATABASE_URL
            - name: SHIPPING_DB_TLS
              value: "true"
            {{- end }}
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ $port | quote }}
            - name: INGESTION_URL
              value: "http://{{ $root.Release.Name }}-product-ingestion:4101"
            - name: RECOMMENDATION_URL
              value: "http://{{ $root.Release.Name }}-recommendation-service:4102"
            - name: AGENT_URL
              value: "http://{{ $root.Release.Name }}-shopping-agent:4103"
            - name: SHIPPING_URL
              value: "http://{{ $root.Release.Name }}-shipping-service:4106"
            - name: PAYMENT_URL
              value: "http://{{ $root.Release.Name }}-payment-service:4105"
            - name: SRE_URL
              value: "http://{{ $root.Release.Name }}-sre-copilot:4104"
            - name: OTEL_SERVICE_VERSION
              value: {{ $image.tag | quote }}
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ $root.Values.deploymentEnvironment | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ $root.Values.otelTracesEndpoint | quote }}
            {{- if or (eq $name "ai-gateway") (eq $name "payment-service") }}
            - name: PAYMENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.paymentSecretName | default (printf "%s-payment" $root.Release.Name) }}
                  key: PAYMENT_SERVICE_TOKEN
                  optional: true
            - name: PUBLIC_ORIGIN
              value: {{ $root.Values.publicOrigin | quote }}
            {{- end }}
            {{- if eq $name "payment-service" }}
            - name: PAYMENT_MODE
              value: {{ $root.Values.paymentMode | quote }}
            {{- range $key := list "RAZORPAY_KEY_ID" "RAZORPAY_KEY_SECRET" "RAZORPAY_WEBHOOK_SECRET" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.paymentSecretName | default (printf "%s-payment" $root.Release.Name) }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if eq $name "ai-gateway" }}
            {{- if $root.Values.integrations.enabled }}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set integrations.secretName for external Redis and RabbitMQ" $root.Values.integrations.secretName }}
                  key: RABBITMQ_URL
            {{- end }}
            - name: LOGIN_ACTIVITY_RETENTION_DAYS
              value: {{ $root.Values.loginActivityRetentionDays | quote }}
            - name: TRUST_PROXY
              value: {{ $root.Values.nginx.enabled | quote }}
            - name: ASSISTANT_AI_ENABLED
              value: {{ $root.Values.aiEnabled | quote }}
            {{- end }}
          {{- if and (eq $name "shopping-agent") $root.Values.agentSecretName }}
          envFrom:
            - secretRef:
                name: {{ $root.Values.agentSecretName }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ if eq $name "shipping-service" }}150{{ else }}30{{ end }}
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: {{ if eq $name "ai-gateway" }}/api/ready{{ else if eq $name "shipping-service" }}/api/shipping/ready{{ else }}/health{{ end }}
              port: http
            timeoutSeconds: 5
          resources:
            {{- if eq $name "shipping-service" }}
            {{- toYaml $root.Values.shipping.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $root.Values.resources | nindent 12 }}
            {{- end }}
          {{- if eq $name "shipping-service" }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
          {{- end }}
          {{- if eq $name "ai-gateway" }}
          volumeMounts:
            - name: data
              mountPath: /app/.data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $root.Release.Name }}-data
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-{{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - port: {{ $port }}
      targetPort: http
      name: http
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
