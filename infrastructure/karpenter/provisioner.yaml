apiVersion: karpenter.sh/v1alpha5
kind: Provisioner
metadata:
  name: jith-karpenter-provisioner
spec:
  ttlSecondsAfterEmpty: 30 # scale down nodes after X seconds without workloads (excluding daemons)
  ttlSecondsUntilExpired: 604800 # expire nodes after 7 days (in seconds) = 7 * 60 * 60 * 24
  limits:
    resources:
      cpu: 1000
  requirements:
    - key: "karpenter.sh/capacity-type"
      operator: In
      values: [ "spot", "on-demand" ]
  provider:
    subnetSelector:
      Name: "*jith*"
    securityGroupSelector:
      Name: "*jith*"
