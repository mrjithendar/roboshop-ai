# keyfactor issuer
# kubectl apply -f keyfactor-acme-issuer.yaml
# Verify
#  kubectl get clusterissuer keyfactor-acme-issuer -o jsonpath="{.status.conditions[].status}"
# Must output 'True'

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: keyfactor-acme-issue
  uid: 42dfc8aa-ba0a-4379-968e-a902860f296c
spec:
  acme:
    email: team@jithendar.com
    externalAccountBinding:
      keyAlgorithm: HS256
      keyID: 123-456-789
      keySecretRef:
        key: secret
        name: eab-secret
    preferredChain: ""
    privateKeySecretRef:
      name: keyfactor-issuer-account-key
    server: http://jithendar.com/internal
    solvers:
      - http01:
          ingress:
            class: nginx-conf