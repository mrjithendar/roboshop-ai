apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "adotcollectorcw.fullname" . }}-otel-prometheus-role-binding
  labels:
  {{- include "adotcollectorcw.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "adotcollectorcw.fullname" . }}-otel-prometheus-role'
subjects:
- kind: ServiceAccount
  name: adot-collector
  namespace: '{{ .Release.Namespace }}'