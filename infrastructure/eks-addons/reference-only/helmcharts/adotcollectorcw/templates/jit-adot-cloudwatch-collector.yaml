apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: {{ include "adotcollectorcw.fullname" . }}-jit-adot-cloudwatch-collector
  labels:
  {{- include "adotcollectorcw.labels" . | nindent 4 }}
spec:
  config: "receivers:\n  #\n  # Scrape configuration for the Prometheus Receiver\n
    \ # This is the same configuration used when Prometheus is installed using the
    community Helm chart\n  # \n  prometheus:\n    config:\n      global:\n        scrape_interval:
    15s\n        scrape_timeout: 10s\n\n      scrape_configs:\n      - job_name: kubernetes-apiservers\n
    \       bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n
    \       kubernetes_sd_configs:\n        - role: endpoints\n        relabel_configs:\n
    \       - action: keep\n          regex: default;kubernetes;https\n          source_labels:\n
    \         - __meta_kubernetes_namespace\n          - __meta_kubernetes_service_name\n
    \         - __meta_kubernetes_endpoint_port_name\n        scheme: https\n        tls_config:\n
    \         ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n          insecure_skip_verify:
    true\n\n      - job_name: kubernetes-nodes\n        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n
    \       kubernetes_sd_configs:\n        - role: node\n        relabel_configs:\n
    \       - action: labelmap\n          regex: __meta_kubernetes_node_label_(.+)\n
    \       - replacement: kubernetes.default.svc:443\n          target_label: __address__\n
    \       - regex: (.+)\n          replacement: /api/v1/nodes/$$1/proxy/metrics\n
    \         source_labels:\n          - __meta_kubernetes_node_name\n          target_label:
    __metrics_path__\n        scheme: https\n        tls_config:\n          ca_file:
    /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n          insecure_skip_verify:
    true\n\n      - job_name: kubernetes-nodes-cadvisor\n        bearer_token_file:
    /var/run/secrets/kubernetes.io/serviceaccount/token\n        kubernetes_sd_configs:\n
    \       - role: node\n        relabel_configs:\n        - action: labelmap\n          regex:
    __meta_kubernetes_node_label_(.+)\n        - replacement: kubernetes.default.svc:443\n
    \         target_label: __address__\n        - regex: (.+)\n          replacement:
    /api/v1/nodes/$$1/proxy/metrics/cadvisor\n          source_labels:\n          -
    __meta_kubernetes_node_name\n          target_label: __metrics_path__\n        scheme:
    https\n        tls_config:\n          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n
    \         insecure_skip_verify: true\n\n      - job_name: kubernetes-service-endpoints\n
    \       kubernetes_sd_configs:\n        - role: endpoints\n        relabel_configs:\n
    \       - action: keep\n          regex: true\n          source_labels:\n          -
    __meta_kubernetes_service_annotation_prometheus_io_scrape\n        - action: replace\n
    \         regex: (https?)\n          source_labels:\n          - __meta_kubernetes_service_annotation_prometheus_io_scheme\n
    \         target_label: __scheme__\n        - action: replace\n          regex:
    (.+)\n          source_labels:\n          - __meta_kubernetes_service_annotation_prometheus_io_path\n
    \         target_label: __metrics_path__\n        - action: replace\n          regex:
    ([^:]+)(?::\\d+)?;(\\d+)\n          replacement: $$1:$$2\n          source_labels:\n
    \         - __address__\n          - __meta_kubernetes_service_annotation_prometheus_io_port\n
    \         target_label: __address__\n        - action: labelmap\n          regex:
    __meta_kubernetes_service_annotation_prometheus_io_param_(.+)\n          replacement:
    __param_$$1\n        - action: labelmap\n          regex: __meta_kubernetes_service_label_(.+)\n
    \       - action: replace\n          source_labels:\n          - __meta_kubernetes_namespace\n
    \         target_label: kubernetes_namespace\n        - action: replace\n          source_labels:\n
    \         - __meta_kubernetes_service_name\n          target_label: kubernetes_name\n
    \       - action: replace\n          source_labels:\n          - __meta_kubernetes_pod_node_name\n
    \         target_label: kubernetes_node\n\n      - job_name: kubernetes-service-endpoints-slow\n
    \       kubernetes_sd_configs:\n        - role: endpoints\n        relabel_configs:\n
    \       - action: keep\n          regex: true\n          source_labels:\n          -
    __meta_kubernetes_service_annotation_prometheus_io_scrape_slow\n        - action:
    replace\n          regex: (https?)\n          source_labels:\n          - __meta_kubernetes_service_annotation_prometheus_io_scheme\n
    \         target_label: __scheme__\n        - action: replace\n          regex:
    (.+)\n          source_labels:\n          - __meta_kubernetes_service_annotation_prometheus_io_path\n
    \         target_label: __metrics_path__\n        - action: replace\n          regex:
    ([^:]+)(?::\\d+)?;(\\d+)\n          replacement: $$1:$$2\n          source_labels:\n
    \         - __address__\n          - __meta_kubernetes_service_annotation_prometheus_io_port\n
    \         target_label: __address__\n        - action: labelmap\n          regex:
    __meta_kubernetes_service_annotation_prometheus_io_param_(.+)\n          replacement:
    __param_$$1\n        - action: labelmap\n          regex: __meta_kubernetes_service_label_(.+)\n
    \       - action: replace\n          source_labels:\n          - __meta_kubernetes_namespace\n
    \         target_label: kubernetes_namespace\n        - action: replace\n          source_labels:\n
    \         - __meta_kubernetes_service_name\n          target_label: kubernetes_name\n
    \       - action: replace\n          source_labels:\n          - __meta_kubernetes_pod_node_name\n
    \         target_label: kubernetes_node\n        scrape_interval: 5m\n        scrape_timeout:
    30s\n        \n      - job_name: prometheus-pushgateway\n        kubernetes_sd_configs:\n
    \       - role: service\n        relabel_configs:\n        - action: keep\n          regex:
    pushgateway\n          source_labels:\n          - __meta_kubernetes_service_annotation_prometheus_io_probe\n\n
    \     - job_name: kubernetes-services\n        kubernetes_sd_configs:\n        -
    role: service\n        metrics_path: /probe\n        params:\n          module:\n
    \         - http_2xx\n        relabel_configs:\n        - action: keep\n          regex:
    true\n          source_labels:\n          - __meta_kubernetes_service_annotation_prometheus_io_probe\n
    \       - source_labels:\n          - __address__\n          target_label: __param_target\n
    \       - replacement: blackbox\n          target_label: __address__\n        -
    source_labels:\n          - __param_target\n          target_label: instance\n
    \       - action: labelmap\n          regex: __meta_kubernetes_service_label_(.+)\n
    \       - source_labels:\n          - __meta_kubernetes_namespace\n          target_label:
    kubernetes_namespace\n        - source_labels:\n          - __meta_kubernetes_service_name\n
    \         target_label: kubernetes_name\n\n      - job_name: kubernetes-pods\n
    \       kubernetes_sd_configs:\n        - role: pod\n        relabel_configs:\n
    \       - action: keep\n          regex: true\n          source_labels:\n          -
    __meta_kubernetes_pod_annotation_prometheus_io_scrape\n        - action: replace\n
    \         regex: (https?)\n          source_labels:\n          - __meta_kubernetes_pod_annotation_prometheus_io_scheme\n
    \         target_label: __scheme__\n        - action: replace\n          regex:
    (.+)\n          source_labels:\n          - __meta_kubernetes_pod_annotation_prometheus_io_path\n
    \         target_label: __metrics_path__\n        - action: replace\n          regex:
    ([^:]+)(?::\\d+)?;(\\d+)\n          replacement: $$1:$$2\n          source_labels:\n
    \         - __address__\n          - __meta_kubernetes_pod_annotation_prometheus_io_port\n
    \         target_label: __address__\n        - action: labelmap\n          regex:
    __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)\n          replacement:
    __param_$$1\n        - action: labelmap\n          regex: __meta_kubernetes_pod_label_(.+)\n
    \       - action: replace\n          source_labels:\n          - __meta_kubernetes_namespace\n
    \         target_label: kubernetes_namespace\n        - action: replace\n          source_labels:\n
    \         - __meta_kubernetes_pod_name\n          target_label: kubernetes_pod_name\n
    \       - action: drop\n          regex: Pending|Succeeded|Failed|Completed\n
    \         source_labels:\n          - __meta_kubernetes_pod_phase\n          \n
    \     - job_name: kubernetes-pods-slow\n        scrape_interval: 5m\n        scrape_timeout:
    30s          \n        kubernetes_sd_configs:\n        - role: pod\n        relabel_configs:\n
    \       - action: keep\n          regex: true\n          source_labels:\n          -
    __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow\n        - action:
    replace\n          regex: (https?)\n          source_labels:\n          - __meta_kubernetes_pod_annotation_prometheus_io_scheme\n
    \         target_label: __scheme__\n        - action: replace\n          regex:
    (.+)\n          source_labels:\n          - __meta_kubernetes_pod_annotation_prometheus_io_path\n
    \         target_label: __metrics_path__\n        - action: replace\n          regex:
    ([^:]+)(?::\\d+)?;(\\d+)\n          replacement: $$1:$$2\n          source_labels:\n
    \         - __address__\n          - __meta_kubernetes_pod_annotation_prometheus_io_port\n
    \         target_label: __address__\n        - action: labelmap\n          regex:
    __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)\n          replacement:
    __param_$1\n        - action: labelmap\n          regex: __meta_kubernetes_pod_label_(.+)\n
    \       - action: replace\n          source_labels:\n          - __meta_kubernetes_namespace\n
    \         target_label: namespace\n        - action: replace\n          source_labels:\n
    \         - __meta_kubernetes_pod_name\n          target_label: pod\n        -
    action: drop\n          regex: Pending|Succeeded|Failed|Completed\n          source_labels:\n
    \         - __meta_kubernetes_pod_phase              \n                                                        \nprocessors:\n
    \ batch/metrics:\n    timeout: 60s\n  #\n  # Processor to transform the names
    of existing labels and/or add new labels to the metrics identified\n  #   \n  metricstransform/labelling:\n
    \   transforms:\n      - include: .*\n        match_type: regexp\n        action:
    update\n        operations:\n          - action: add_label\n            new_label:
    EKS_Cluster\n            new_value: jit-eks-tst\n          - action: update_label\n
    \           label: kubernetes_pod_name\n            new_label: EKS_PodName\n          -
    action: update_label\n            label: kubernetes_namespace\n            new_label:
    EKS_Namespace               \n\nexporters:\n  #\n  # AWS EMF exporter that sends
    metrics data as performance log events to Amazon CloudWatch\n  # Only the metrics
    that were filtered out by the processors get to this stage of the pipeline\n  #
    Under the metric_declarations field, add one or more sets of Amazon CloudWatch
    dimensions\n  # Each dimension must alredy exist as a label on the Prometheus
    metric\n  # For each set of dimensions, add a list of metrics under the metric_name_selectors
    field\n  # Metrics names may be listed explicitly or using regular expressions\n
    \ # A default list of metrics has been provided\n  # Data from performance log
    events will be aggregated by Amazon CloudWatch using these dimensions to create
    an Amazon CloudWatch custom metric\n  #    \n  awsemf:\n    region: \"us-east-1\"\n
    \   namespace: ContainerInsights/Prometheus\n    log_group_name: '/aws/containerinsights/jit-eks-tst/prometheus'\n
    \   resource_to_telemetry_conversion:\n      enabled: true\n    dimension_rollup_option:
    NoDimensionRollup\n    parse_json_encoded_attr_values: [Sources, kubernetes]\n
    \   metric_declarations:\n      - dimensions: [[EKS_Cluster, EKS_Namespace, EKS_PodName]]\n
    \       metric_name_selectors:\n          - apiserver_request_.*\n          -
    container_memory_.*\n          - container_threads\n          - otelcol_process_.*\nservice:\n
    \ pipelines:\n    metrics:\n      receivers: [prometheus]\n      processors: [batch/metrics,metricstransform/labelling]\n
    \     exporters: [awsemf]         \n"
  env:
  - name: CLUSTER_NAME
    value: demo-eks-cluster-test
  mode: deployment
  podAnnotations:
    prometheus.io/port: "8888"
    prometheus.io/scrape: "true"
  resources:
    limits:
      cpu: "1"
    requests:
      cpu: "1"
  serviceAccount: adot-collector