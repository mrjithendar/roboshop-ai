apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: {{ include "adotcollectorxray.fullname" . }}-jit-adot-xray-collector
  labels:
  {{- include "adotcollectorxray.labels" . | nindent 4 }}
spec:
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch/traces:
        timeout: 1s
        send_batch_size: 50

    exporters:
      awsxray:
        region: us-east-1

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch/traces]
          exporters: [awsxray]
  mode: deployment
  resources:
    limits:
      cpu: "1"
    requests:
      cpu: "1"
  serviceAccount: adot-collector