apiVersion: karpenter.sh/v1alpha5
kind: Provisioner
metadata:
  name: {{ include "karpenterprovisioner.fullname" . }}-karpenter-provisioner
  labels:
  {{- include "karpenterprovisioner.labels" . | nindent 4 }}
spec:
  limits:
    resources:
      cpu: 1000
  providerRef:
    name: jit-node-provider
  requirements:
  - key: karpenter.k8s.aws/instance-category
    operator: In
    values:
    - c
    - m
    - r
  - key: karpenter.k8s.aws/instance-cpu
    operator: In
    values:
    - "4"
    - "8"
    - "16"
    - "32"
  - key: karpenter.k8s.aws/instance-hypervisor
    operator: In
    values:
    - nitro
  - key: karpenter.k8s.aws/instance-generation
    operator: Gt
    values:
    - "2"
  - key: kubernetes.io/arch
    operator: In
    values:
    - arm64
    - amd64
  - key: karpenter.sh/capacity-type
    operator: In
    values:
    - spot
    - on-demand
  ttlSecondsAfterEmpty: 60
  ttlSecondsUntilExpired: 604800