# Apply only to the intended EKS ingress after DNS points at its load balancer.
# kubectl --context=<eks-context> -n <namespace> patch ingress <name> \
#   --type=merge --patch-file infrastructure/eks-addons/eks_ingress_patch.yaml
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - jithendar.com
      secretName: jithendar-com-tls
