  {{- include "karpenterprovisioner.labels" . | nindent 4 }}
spec:
  securityGroupSelector:
    karpenter.sh/discovery: '*'
  subnetSelector:
    karpenter.sh/discovery: '*'
  tags:
    karpenter.sh/discovery: '*'