# patch ingress
# kubectl patch ingress -n latest default-jithendar --patch-file ingress-patch.yaml
# Verify
# kubectl get cert -n latest
# kubectl get cert default-trax-tls -n latest -o jsonpath="{.status.conditions[].status}"
# Must output 'True'

metadata:
  annotations:
    cert-manager.io/cluster-issuer: keyfactor-acme-issuer
spec:
  tls:
    - hosts:
        - jithendar.com
      secretName: default-jithendar-tls