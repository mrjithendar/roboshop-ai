# Only Traefik may reach the site; the site needs no egress beyond DNS.
# kindnet enforcement is unverified (SEO_AUDIT AUD-013); this is correct either way.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jithendar-com
spec:
  podSelector:
    matchLabels:
      app: jithendar-com
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 3000
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
