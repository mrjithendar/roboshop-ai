# Identity CI uses to deploy jithendar.com (kubectl apply -k deploy/production).
# Applied once by an admin, never by CI: kubectl --context mk4 apply -f deploy/ci-access/rbac.yaml
# Scope: namespace jithendar only, only the kinds in deploy/production, no delete, no Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jithendar-deployer
  namespace: jithendar
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jithendar-deployer
  namespace: jithendar
rules:
- apiGroups: ["apps"]
  resources: [deployments]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: ["apps"]
  resources: [replicasets]
  verbs: [get, list, watch]   # rollout status / undo
- apiGroups: [""]
  resources: [services]
  verbs: [get, list, create, update, patch]
- apiGroups: [""]
  resources: [pods, events]
  verbs: [get, list, watch]   # diagnostics when a rollout fails
- apiGroups: ["networking.k8s.io"]
  resources: [ingresses, networkpolicies]
  verbs: [get, list, create, update, patch]
- apiGroups: ["policy"]
  resources: [poddisruptionbudgets]
  verbs: [get, list, create, update, patch]
- apiGroups: ["cert-manager.io"]
  resources: [certificates]
  verbs: [get, list, create, update, patch]
- apiGroups: ["traefik.io"]
  resources: [middlewares]
  verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jithendar-deployer
  namespace: jithendar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jithendar-deployer
subjects:
- kind: ServiceAccount
  name: jithendar-deployer
  namespace: jithendar
