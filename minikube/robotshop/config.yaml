apiVersion: v1
kind: Namespace
metadata:
  name: robotshop-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: robotshop-config
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
data:
  HOST: 0.0.0.0
  APP_ENV: development
  PUBLIC_ORIGIN: https://jithendar.com
  REGISTRATION_CHALLENGE_PROVIDER: disabled
  PAYMENT_MODE: test
  MONGODB_DATABASE: robotshop
  CART_URL: http://cart-service:4107
  CATALOGUE_URL: http://catalogue-service:4108
  RECOMMENDATION_URL: http://recommendation-service:4102
  AGENT_URL: http://shopping-agent:4103
  SRE_URL: http://sre-copilot:4104
  PAYMENT_URL: http://payment-service:4105
  SHIPPING_URL: http://shipping-service:4106
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  OTEL_SERVICE_VERSION: 0.2.0
  DEPLOYMENT_ENVIRONMENT: minikube
  OTEL_SDK_DISABLED: 'false'
