# TLS secrets are namespace-local; monitoring and WordPress keep their certificates.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jithendar-com
  namespace: roboshop-ai
spec:
  secretName: jithendar-com-tls
  dnsNames: [jithendar.com]
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: roboshop-prefix
  namespace: roboshop-ai
spec:
  stripPrefix:
    prefixes: [/roboshop]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: roboshop-https
  namespace: roboshop-ai
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roboshop
  namespace: roboshop-ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: roboshop-ai-roboshop-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jithendar.com]
      secretName: jithendar-com-tls
  rules:
    - host: jithendar.com
      http:
        paths:
          - path: /roboshop
            pathType: Prefix
            backend:
              service:
                name: nginx
                port: {number: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roboshop-http
  namespace: roboshop-ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: roboshop-ai-roboshop-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jithendar.com
      http:
        paths:
          - path: /roboshop
            pathType: Prefix
            backend:
              service:
                name: nginx
                port: {number: 8080}
