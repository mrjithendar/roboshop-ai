apiVersion: v1
kind: ConfigMap
metadata:
  name: roboshop-config
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
data:

  # Application runtime
  # HOST is the container listen address. PUBLIC_ORIGIN is the browser-facing origin.
  # APP_ENV is the application mode; DEPLOYMENT_ENVIRONMENT below labels telemetry.
  HOST: "0.0.0.0"
  APP_ENV: "development"
  PUBLIC_ORIGIN: "https://jithendar.com"
  LOG_FORMAT: "json"
  # DEBUG adds probe/dependency detail; WARN or ERROR reduces volume. Restart pods to apply.
  LOG_LEVEL: "INFO"

  # Checkout and payment
  # Test mode does not charge real money. Live mode also requires valid live secrets.
  # New payments use INR only; source prices and shipping are converted by the gateway.
  PAYMENT_MODE: "test"
  CHECKOUT_CURRENCIES: "INR"
  CURRENCY_URL: "http://currency-service:4111"

  # Registration protection
  # Turnstile credentials are supplied separately through Secrets.
  REGISTRATION_CHALLENGE_PROVIDER: "turnstile"
  TURNSTILE_HOSTNAME: "jithendar.com"

  # Internal service addresses
  # These Kubernetes DNS names resolve inside roboshop-ai.
  # Recommendations share catalogue-service; moks runs the shopping assistant.
  USER_URL: "http://user-service:4109"
  CART_URL: "http://cart-service:4107"
  CATALOGUE_URL: "http://catalogue-service:4108"
  RECOMMENDATION_URL: "http://catalogue-service:4108"
  AGENT_URL: "http://moks:4103"
  PAYMENT_URL: "http://payment-service:4105"
  SHIPPING_URL: "http://shipping-service:4106"

  # Database selection
  # Database name only. Connection credentials are supplied separately.
  MONGODB_DATABASE: "roboshop"

  # Tracing and telemetry
  # Traces go to the in-cluster collector. Content capture stays disabled.
  # Boolean-looking values are strings because ConfigMap data becomes environment variables.
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
  OTEL_SERVICE_NAMESPACE: "roboshop-ai"
  OTEL_SERVICE_VERSION: "0.2.0"
  DEPLOYMENT_ENVIRONMENT: "minikube"
  OTEL_SDK_DISABLED: "false"
  LANGFUSE_CAPTURE_CONTENT: "false"

  # MongoDB initialization file
  # Mounted into the MongoDB initialization directory; creates the application user.
  # Editing this does not change users or passwords in an existing database.
  10-app-user.js: |
    // Official Mongo image runs this only on an empty data volume.
    const application = db.getSiblingDB('roboshop');
    application.createUser({ user: 'roboshop', pwd: process.env.MONGO_APP_PASSWORD, roles: [{ role: 'readWrite', db: 'roboshop' }] });

  # Shipping PostgreSQL initialization file
  # Mounted into the PostgreSQL initialization directory for a fresh database.
  # Shipping migrations manage subsequent schema changes.
  10-shipping-role.sh: |
    #!/bin/sh
    set -eu
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 <<'SQL'
    \getenv app_password SHIPPING_APP_PASSWORD
    CREATE ROLE shipping_app LOGIN PASSWORD :'app_password';
    CREATE SCHEMA shipping AUTHORIZATION shipping;
    GRANT USAGE ON SCHEMA shipping TO shipping_app;
    ALTER DEFAULT PRIVILEGES FOR ROLE shipping IN SCHEMA shipping GRANT SELECT ON TABLES TO shipping_app;
    SQL

  # Redis configuration file
  # Internal cache with a 128 MB limit; reproducible entries may be evicted.
  # The password is injected at startup, not stored here.
  redis.conf: |
    # Internal cache only. Password is injected at startup, never stored here.
    bind 0.0.0.0
    protected-mode yes
    port 6379
    maxmemory 128mb
    maxmemory-policy allkeys-lru
    # Cached location queries are reproducible from PostgreSQL.
    appendonly no
    save ""

  # RabbitMQ configuration file
  # Internal broker ports. Applications declare exchanges, queues and dead-letter bindings.
  rabbitmq.conf: |
    # Internal AMQP and management UI; use a private port-forward for management.
    # Production uses a managed TLS broker via the Helm integration Secret.
    listeners.tcp.default = 5672
    management.tcp.port = 15672
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute = 1GB
    # Exchanges, quorum queues and DLQ bindings are declared by the applications.
