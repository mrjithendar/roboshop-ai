apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roboshop-http
  namespace: roboshop-ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: roboshop-ai-roboshop-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jithendar.com
      http:
        paths:
          - path: /roboshop
            pathType: Prefix
            backend:
              service:
                # One web service: storefront files plus the /api proxy.
                name: web
                port: {number: 8080}
