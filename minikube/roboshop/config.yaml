apiVersion: v1
kind: Namespace
metadata:
  name: roboshop-ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: roboshop-config
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
data:
  LOG_FORMAT: text
  CHECKOUT_CURRENCIES: INR,USD,GBP,SGD,AUD
  CURRENCY_URL: http://currency-service:4111
  HOST: 0.0.0.0
  APP_ENV: development
  PUBLIC_ORIGIN: https://jithendar.com
  REGISTRATION_CHALLENGE_PROVIDER: turnstile
  TURNSTILE_HOSTNAME: jithendar.com
  PAYMENT_MODE: test
  MONGODB_DATABASE: roboshop
  USER_URL: http://user-service:4109
  CART_URL: http://cart-service:4107
  CATALOGUE_URL: http://catalogue-service:4108
  RECOMMENDATION_URL: http://catalogue-service:4108
  AGENT_URL: http://moks:4103
  SRE_URL: http://sre-copilot:4104
  PAYMENT_URL: http://payment-service:4105
  SHIPPING_URL: http://shipping-service:4106
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  OTEL_SERVICE_NAMESPACE: roboshop-ai
  LANGFUSE_CAPTURE_CONTENT: 'false'
  OTEL_SERVICE_VERSION: 0.2.0
  DEPLOYMENT_ENVIRONMENT: minikube
  OTEL_SDK_DISABLED: 'false'
  10-app-user.js: '// Official Mongo image runs this only on an empty data volume.

    const application = db.getSiblingDB(''roboshop'');

    application.createUser({ user: ''roboshop'', pwd: process.env.MONGO_APP_PASSWORD,
    roles: [{ role: ''readWrite'', db: ''roboshop'' }] });

    '
  10-shipping-role.sh: '#!/bin/sh

    set -eu

    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1
    <<''SQL''

    \getenv app_password SHIPPING_APP_PASSWORD

    CREATE ROLE shipping_app LOGIN PASSWORD :''app_password'';

    CREATE SCHEMA shipping AUTHORIZATION shipping;

    GRANT USAGE ON SCHEMA shipping TO shipping_app;

    ALTER DEFAULT PRIVILEGES FOR ROLE shipping IN SCHEMA shipping GRANT SELECT ON
    TABLES TO shipping_app;

    SQL

    '
  redis.conf: '# Internal cache only. Password is injected at startup, never stored
    here.

    bind 0.0.0.0

    protected-mode yes

    port 6379

    maxmemory 128mb

    maxmemory-policy allkeys-lru

    # Cached location queries are reproducible from PostgreSQL.

    appendonly no

    save ""

    '
  rabbitmq.conf: '# Internal AMQP and management UI; use a private port-forward for
    management.

    # Production uses a managed TLS broker via the Helm integration Secret.

    listeners.tcp.default = 5672

    management.tcp.port = 15672

    vm_memory_high_watermark.relative = 0.6

    disk_free_limit.absolute = 1GB

    # Exchanges, quorum queues and DLQ bindings are declared by the applications.

    '
  config.yaml: "receivers:\n  otlp:\n    protocols:\n      http:\n        endpoint:\
    \ 0.0.0.0:4318\nprocessors:\n  memory_limiter:\n    check_interval: 1s\n    limit_mib:\
    \ 128\n  attributes/privacy:\n    actions:\n      - key: url.full\n        action:\
    \ delete\n      - key: url.query\n        action: delete\n      - key: http.url\n\
    \        action: delete\n      - key: http.target\n        action: delete\n  \
    \    - key: client.address\n        action: delete\n      - key: network.peer.address\n\
    \        action: delete\n      - key: enduser.id\n        action: delete\n   \
    \   - key: db.statement\n        action: delete\n      - key: db.query.text\n\
    \        action: delete\n      - key: http.request.header.authorization\n    \
    \    action: delete\n      - key: http.request.header.cookie\n        action:\
    \ delete\n      - key: exception.message\n        action: delete\n      - key:\
    \ exception.stacktrace\n        action: delete\n      - key: gen_ai.input.messages\n\
    \        action: delete\n      - key: gen_ai.output.messages\n        action:\
    \ delete\n  filter/routine:\n    error_mode: ignore\n    trace_conditions:\n \
    \     - 'span.attributes[\"http.route\"] != nil and IsMatch(span.attributes[\"\
    http.route\"], \"^/(health(/live|/ready)?|ready|metrics|api/[^/]+/ready)$\") and\
    \ span.status.code != STATUS_CODE_ERROR and ((span.attributes[\"http.response.status_code\"\
    ] != nil and span.attributes[\"http.response.status_code\"] < 400) or (span.attributes[\"\
    http.status_code\"] != nil and span.attributes[\"http.status_code\"] < 400))'\n\
    \      # Keep error status/type; exception events can contain SQL, addresses or\
    \ secrets.\n      - 'spanevent.name == \"exception\"'\n  batch:\n    timeout:\
    \ 2s\nexporters:\n  otlphttp/jaeger:\n    endpoint: http://jaeger:4318\nservice:\n\
    \  pipelines:\n    traces:\n      receivers: [otlp]\n      processors: [memory_limiter,\
    \ attributes/privacy, filter/routine, batch]\n      exporters: [otlphttp/jaeger]\n"
