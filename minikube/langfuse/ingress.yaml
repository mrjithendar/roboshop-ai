apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langfuse
  namespace: langfuse
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jithendar.com]
  rules:
    - host: jithendar.com
      http:
        paths:
          - path: /langfuse
            pathType: Prefix
            backend:
              service:
                name: langfuse-web
                port: {number: 3000}
