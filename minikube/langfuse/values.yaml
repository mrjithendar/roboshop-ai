# Langfuse chart 2.1.6 / application 4.63.0. Development, not HA.
langfuse:
  nextauth:
    url: https://jithendar.com/langfuse/api/auth
  features:
    telemetryEnabled: false
  replicas: 1
  web:
    image:
      repository: 881026659929.dkr.ecr.us-east-1.amazonaws.com/roboshop-langfuse
      tag: 4.63.0-subpath
      pullSecrets:
        - name: ecr-pull
    livenessProbe:
      path: /langfuse/api/public/health
    readinessProbe:
      path: /langfuse/api/public/ready
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: '1', memory: 1Gi}
  worker:
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: '1', memory: 1Gi}
  ingress:
    enabled: false
postgresql:
  storage:
    requestedSize: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
redis:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
# A standalone ClickHouse avoids installing cluster-wide operator CRDs/Keeper.
clickhouse:
  deploy: false
  host: langfuse-clickhouse
  cluster:
    enabled: false
  auth:
    username: langfuse
    existingSecret: langfuse-clickhouse
    existingSecretKey: password
s3:
  allInOne:
    data:
      size: 10Gi
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: '1', memory: 1Gi}
