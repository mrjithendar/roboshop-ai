apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: prometheus-auth
  namespace: {{ .Release.Namespace }}
spec:
  basicAuth:
    secret: monitoring-auth
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-prometheus-auth@kubernetescrd" .Release.Namespace | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jithendar.com]
      secretName: jithendar-com-tls
  rules:
    - host: jithendar.com
      http:
        paths:
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port: {number: 9090}
