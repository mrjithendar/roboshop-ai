{{- $root := . }}
{{- range $issuer := .Values.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $issuer.name | quote }}
spec:
  acme:
    email: {{ required "Set an ACME email" $root.Values.email | quote }}
    server: {{ $issuer.server | quote }}
    privateKeySecretRef:
      name: {{ $issuer.accountSecret | quote }}
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ required "Set ingressClassName" $root.Values.ingressClassName | quote }}
{{- end }}
