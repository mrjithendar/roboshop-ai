{{- if .Values.issuers.staging }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuers.staging.name | quote }}
spec:
  acme:
    email: {{ required "Set an ACME email" .Values.email | quote }}
    server: {{ .Values.issuers.staging.server | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuers.staging.accountSecret | quote }}
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ required "Set ingressClassName" .Values.ingressClassName | quote }}
{{- end }}
