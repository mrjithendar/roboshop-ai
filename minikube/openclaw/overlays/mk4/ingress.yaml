apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: openclaw-openclaw-auth@kubernetescrd,openclaw-openclaw-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - jithendar.com
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /openclaw
        pathType: Prefix
        backend:
          service:
            name: openclaw
            port:
              number: 18789
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openclaw-auth
  namespace: openclaw
spec:
  basicAuth:
    secret: openclaw-edge-auth
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openclaw-headers
  namespace: openclaw
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    contentSecurityPolicy: default-src 'self'; script-src 'self'; style-src 'self'
      'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://jithendar.com;
      frame-ancestors 'none'; base-uri 'self'; form-action 'self'
    customResponseHeaders:
      Cache-Control: no-store
      Permissions-Policy: camera=(), microphone=(), geolocation=()
    customRequestHeaders:
      Cookie: ''
