apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: openclaw-openclaw-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - jithendar.com
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /openclaw
        pathType: Prefix
        backend:
          service:
            name: openclaw
            port:
              number: 18789
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openclaw-auth
  namespace: openclaw
spec:
  # Retained for rollback only; not attached to the ingress.
  # Native gateway Bearer authentication must reach OpenClaw unchanged.
  basicAuth:
    # Separate credentials from other protected apps on jithendar.com.
    realm: OpenClaw
    secret: openclaw-edge-auth
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openclaw-headers
  namespace: openclaw
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    # Preserve the gateway CSP, including hashes for its access-check script.
    contentSecurityPolicy: null
    customResponseHeaders:
      Cache-Control: no-store
      Permissions-Policy: camera=(), microphone=(), geolocation=()
    # Preserve gateway session cookies across page loads.
    customRequestHeaders: null
