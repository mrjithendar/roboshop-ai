apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operations-api-egress
  namespace: openclaw
spec:
  podSelector:
    matchLabels:
      app: openclaw-operations
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 192.168.49.2/32
    - ipBlock:
        cidr: 10.96.0.1/32
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8443
