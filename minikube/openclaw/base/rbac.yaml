apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-observer
  namespace: roboshop-ai
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  - events
  - services
  verbs:
  - get
  - list
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-observer
  namespace: roboshop-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-observer
subjects:
- kind: ServiceAccount
  name: openclaw-operations
  namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-observer
  namespace: argocd
rules:
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-observer
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-observer
subjects:
- kind: ServiceAccount
  name: openclaw-operations
  namespace: openclaw
