apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      imagePullSecrets:
      - name: openclaw-registry
      serviceAccountName: openclaw
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: openclaw
        image: ghcr.io/openclaw/openclaw:2026.10.7@sha256:fb26f0841659dc757f23feec9adeab51f11d76779a409db5d22e191b43841afa
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 18789
        securityContext: &id001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /startupz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: state
          mountPath: /home/node/.openclaw
        - name: config
          mountPath: /etc/openclaw
          readOnly: true
        - name: agents
          mountPath: /workspaces/orchestrator/AGENTS.md
          subPath: orchestrator.md
          readOnly: true
        - name: agents
          mountPath: /workspaces/sre/AGENTS.md
          subPath: sre.md
          readOnly: true
        - name: agents
          mountPath: /workspaces/argocd/AGENTS.md
          subPath: argocd.md
          readOnly: true
        - name: agents
          mountPath: /workspaces/github/AGENTS.md
          subPath: github.md
          readOnly: true
        - name: agents
          mountPath: /workspaces/aws/AGENTS.md
          subPath: aws.md
          readOnly: true
        - name: agents
          mountPath: /workspaces/observability/AGENTS.md
          subPath: observability.md
          readOnly: true
        - name: agents
          mountPath: /workspaces/roboshop/AGENTS.md
          subPath: roboshop.md
          readOnly: true
        - name: agents
          mountPath: /workspaces/blog/AGENTS.md
          subPath: blog.md
          readOnly: true
        - name: plugins
          mountPath: /opt/openclaw-plugins
          readOnly: true
        env:
        - name: XDG_CACHE_HOME
          value: /tmp/cache
        - name: NODE_COMPILE_CACHE
          value: /tmp/node-compile-cache
        - name: OPENCLAW_CONFIG_PATH
          value: /etc/openclaw/openclaw.json
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_PLUGINS_DIR
          value: /opt/openclaw-plugins
        envFrom:
        - secretRef:
            name: openclaw-gateway-secrets
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: state
        persistentVolumeClaim:
          claimName: openclaw-state
      - name: config
        configMap:
          name: openclaw-config
      - name: agents
        configMap:
          name: openclaw-agent-instructions
      - name: plugins
        emptyDir:
          sizeLimit: 256Mi
      initContainers:
      - name: telemetry-plugins
        image: 528804350166.dkr.ecr.us-east-1.amazonaws.com/roboshop-mcp-server@sha256:0e02d68ab9371decb4248f855d483405f08d2b831001df3a3f551229ec4ba2bd
        command:
        - python
        - -c
        - import shutil; shutil.copytree("/opt/openclaw-plugins", "/plugins", dirs_exist_ok=True)
        securityContext: *id001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: plugins
          mountPath: /plugins
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  type: ClusterIP
  selector:
    app: openclaw
  ports:
  - name: http
    port: 18789
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-operations
  namespace: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw-operations
  template:
    metadata:
      labels:
        app: openclaw-operations
    spec:
      imagePullSecrets:
      - name: openclaw-registry
      serviceAccountName: openclaw-operations
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: openclaw-operations
        image: 528804350166.dkr.ecr.us-east-1.amazonaws.com/roboshop-mcp-server@sha256:0e02d68ab9371decb4248f855d483405f08d2b831001df3a3f551229ec4ba2bd
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 4180
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: identities
          mountPath: /var/run/ops-identities
          readOnly: true
        - name: api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        envFrom:
        - configMapRef:
            name: openclaw-operations-config
        - secretRef:
            name: openclaw-integration-secrets
            optional: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: identities
        secret:
          secretName: openclaw-operations-identities
          defaultMode: 288
      - name: api-access
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-operations
  namespace: openclaw
spec:
  type: ClusterIP
  selector:
    app: openclaw-operations
  ports:
  - name: http
    port: 4180
    targetPort: http
