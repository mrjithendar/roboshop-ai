# Reuse the shared jithendar.com TLSStore; reserve /ui and /v1 for Vault.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-shortcut
  namespace: vault
spec:
  redirectRegex:
    regex: ^https?://jithendar\.com/vault(/.*)?$
    replacement: https://jithendar.com/ui/
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vault-https
  namespace: vault
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: vault
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /ui
        pathType: Prefix
        backend:
          service:
            name: vault-ui
            port:
              number: 8200
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: vault-ui
            port:
              number: 8200
  tls:
  - hosts:
    - jithendar.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-shortcut
  namespace: vault
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: vault-vault-shortcut@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /vault
        pathType: Prefix
        backend:
          service:
            name: vault-ui
            port:
              number: 8200
  tls:
  - hosts:
    - jithendar.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-http
  namespace: vault
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: vault-vault-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /vault
        pathType: Prefix
        backend:
          service:
            name: vault-ui
            port:
              number: 8200
      - path: /ui
        pathType: Prefix
        backend:
          service:
            name: vault-ui
            port:
              number: 8200
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: vault-ui
            port:
              number: 8200
