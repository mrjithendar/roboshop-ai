apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-http
  namespace: vault
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: vault-vault-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /vault
        pathType: Prefix
        backend:
          service:
            name: vault-ui
            port:
              number: 8200
      - path: /ui
        pathType: Prefix
        backend:
          service:
            name: vault-ui
            port:
              number: 8200
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: vault-ui
            port:
              number: 8200
