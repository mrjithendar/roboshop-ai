# Persistent single-server lab. Never use dev mode for stored secrets.
global:
  tlsDisable: true
injector:
  enabled: false
server:
  image:
    repository: hashicorp/vault
    tag: '2.0.4'
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true
      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable = 1
      }
      storage "file" {
        path = "/vault/data"
      }
  ha:
    enabled: false
  dataStorage:
    enabled: true
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
  readinessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true
  livenessProbe:
    enabled: false
ui:
  enabled: true
  serviceType: ClusterIP
  # Initialization/unseal UI must work before the server is ready for secrets.
  publishNotReadyAddresses: true
