groups:
- name: openclaw
  rules:
  - alert: OpenClawOperationsUnavailable
    expr: up{job="openclaw-operations"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Operations gateway scrape unavailable
  - alert: OpenClawToolFailures
    expr: sum by (tool) (rate(openclaw_tool_calls_total{outcome!="ok"}[5m])) > 0.05
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Operational integration failures
  - alert: OpenClawAuthenticationFailures
    expr: increase(openclaw_auth_failures_total[5m]) > 10
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Repeated operations authentication failures
  - alert: OpenClawSlowTools
    expr: histogram_quantile(0.95, sum by (le) (rate(openclaw_tool_duration_seconds_bucket[5m])))
      > 10
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Operations tool p95 exceeds 10 seconds
  - alert: OpenClawMemoryPressure
    expr: sum by (pod) (container_memory_working_set_bytes{namespace="openclaw",container!=""})
      > 1800000000
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: OpenClaw pod memory pressure
  - alert: OpenClawGatewayUnavailable
    expr: up{job="openclaw-gateway-telemetry"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: OpenClaw gateway telemetry unavailable
  - alert: OpenClawSlowLLM
    expr: histogram_quantile(0.95, sum by (le) (rate(openclaw_model_call_duration_seconds_bucket[5m])))
      > 60
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: LLM p95 latency exceeds 60 seconds
  - alert: OpenClawTokenBudget
    expr: sum(increase(openclaw_model_tokens_total[1h])) > 1000000
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: OpenClaw hourly token budget exceeded; tune to approved budget
