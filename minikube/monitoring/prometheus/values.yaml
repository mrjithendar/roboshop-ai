image: prom/prometheus:v3.15.0
storage: 5Gi
# Minikube hostPath-backed storage may not apply fsGroup ownership automatically.
volumePermissions:
  enabled: true
  image: busybox:1.37.0
retentionTime: 7d
retentionSize: 4GB
# Discover nodes and collect kubelet/container metrics through the authenticated API proxy.
kubernetesMetrics:
  enabled: true
# Add Kubernetes-reachable scrape jobs here. Docker Compose DNS is separate.
extraScrapeConfigs: []
# Example:
# - job_name: robotshop
#   static_configs:
#     - targets: ["ai-gateway.robotshop-ai.svc.cluster.local:3000"]
