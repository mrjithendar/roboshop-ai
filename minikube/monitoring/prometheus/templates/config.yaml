apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Release.Namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    {{- if .Values.openclaw.enabled }}
    rule_files: [/etc/prometheus/openclaw-alerts.yml]
    {{- end }}
    scrape_configs:
      - job_name: prometheus
        metrics_path: /prometheus/metrics
        static_configs:
          - targets: ["localhost:9090"]
      {{- if .Values.kubernetesMetrics.enabled }}
      {{- range $job, $path := dict "kubernetes-kubelet" "metrics" "kubernetes-cadvisor" "metrics/cadvisor" }}
      - job_name: {{ $job }}
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/{{ $path }}
      {{- end }}
      {{- end }}
      {{- if .Values.openclaw.enabled }}
      - job_name: openclaw-operations
        authorization:
          credentials_file: /var/run/openclaw-metrics/token
        static_configs:
          - targets: ["openclaw-operations.openclaw.svc:4180"]
      - job_name: openclaw-gateway-telemetry
        metrics_path: /api/diagnostics/prometheus
        authorization:
          credentials_file: /var/run/openclaw-metrics/gateway-token
        static_configs:
          - targets: ["openclaw.openclaw.svc:18789"]
      - job_name: roboshop-ai-gateway
        static_configs:
          - targets: ["ai-gateway.roboshop-ai.svc:3000"]
      {{- end }}
      {{- with .Values.extraScrapeConfigs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

  {{- if .Values.openclaw.enabled }}
  openclaw-alerts.yml: |
    {{- .Files.Get "files/openclaw-alerts.yml" | nindent 4 }}
  {{- end }}
