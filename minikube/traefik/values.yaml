fullnameOverride: traefik
deployment:
  replicas: 1
ingressClass:
  enabled: true
  name: traefik
  isDefaultClass: false
providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    # NodePort has no load-balancer status to copy. Publish the host entrypoint.
    publishedService:
      enabled: false
    ingressEndpoint:
      hostname: jithendar.com
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
# HTTP stays available for cert-manager's HTTP-01 challenges.
# Grafana's own Ingress is HTTPS-only. The dashboard is not exposed.
ingressRoute:
  dashboard:
    enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
