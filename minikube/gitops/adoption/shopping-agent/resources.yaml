# mk4 adoption baseline; preserves existing controller type and configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: roboshop-ai
  name: shopping-agent
  namespace: roboshop-ai
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: shopping-agent
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app: shopping-agent
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: AWS_ACCESS_KEY_ID
              name: roboshop-secrets
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: AWS_SECRET_ACCESS_KEY
              name: roboshop-secrets
              optional: true
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              key: AWS_SESSION_TOKEN
              name: roboshop-secrets
              optional: true
        - name: LLM_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              key: LLM_SERVICE_TOKEN
              name: roboshop-secrets
        - name: AI_GATEWAY_URL
          value: http://ai-gateway:3000
        - name: OLLAMA_ENDPOINTS_JSON
          value: '{}'
        envFrom:
        - configMapRef:
            name: roboshop-config
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/roboshop-shopping-agent:local
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: 4103
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 3
        name: shopping-agent
        ports:
        - containerPort: 4103
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: 4103
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 120
          httpGet:
            path: /health
            port: 4103
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      imagePullSecrets:
      - name: ecr-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: roboshop-ai
  name: shopping-agent
  namespace: roboshop-ai
spec:
  clusterIP: 10.101.58.19
  clusterIPs:
  - 10.101.58.19
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: p4103
    port: 4103
    protocol: TCP
    targetPort: 4103
  selector:
    app: shopping-agent
  sessionAffinity: None
  type: ClusterIP
