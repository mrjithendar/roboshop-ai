# mk4 adoption baseline; preserves existing controller type and configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: roboshop-ai
  name: product-ingestion
  namespace: roboshop-ai
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: product-ingestion
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app: product-ingestion
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MONGO_APP_PASSWORD
              name: roboshop-secrets
        - name: MONGODB_URL
          value: mongodb://roboshop:$(MONGO_APP_PASSWORD)@mongodb:27017/roboshop?authSource=roboshop
        envFrom:
        - configMapRef:
            name: roboshop-config
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/roboshop-product-ingestion:local
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: 4101
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 3
        name: product-ingestion
        ports:
        - containerPort: 4101
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 4101
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 120
          httpGet:
            path: /health
            port: 4101
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      imagePullSecrets:
      - name: ecr-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: roboshop-ai
  name: product-ingestion
  namespace: roboshop-ai
spec:
  clusterIP: 10.96.35.144
  clusterIPs:
  - 10.96.35.144
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: p4101
    port: 4101
    protocol: TCP
    targetPort: 4101
  selector:
    app: product-ingestion
  sessionAffinity: None
  type: ClusterIP
