# mk4 adoption baseline; preserves existing controller type and configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: roboshop-ai
  name: mongodb
  namespace: roboshop-ai
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mongodb
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: {}
      labels:
        app: mongodb
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: root
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MONGO_ROOT_PASSWORD
              name: roboshop-secrets
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MONGO_APP_PASSWORD
              name: roboshop-secrets
        image: mongo:8.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: 27017
          timeoutSeconds: 3
        name: mongodb
        ports:
        - containerPort: 27017
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        startupProbe:
          failureThreshold: 120
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: 27017
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/db
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: init
          readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mongodb-data
      - configMap:
          defaultMode: 365
          items:
          - key: 10-app-user.js
            path: 10-app-user.js
          name: roboshop-config
        name: init
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: roboshop-ai
  name: mongodb
  namespace: roboshop-ai
spec:
  clusterIP: 10.109.220.96
  clusterIPs:
  - 10.109.220.96
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: p27017
    port: 27017
    protocol: TCP
    targetPort: 27017
  selector:
    app: mongodb
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  finalizers:
  - kubernetes.io/pvc-protection
  labels:
    app.kubernetes.io/part-of: roboshop-ai
  name: mongodb-data
  namespace: roboshop-ai
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
  volumeMode: Filesystem
