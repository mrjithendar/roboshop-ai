{{- if .Values.ingress.enabled }}
# Plain HTTP for the site and its aliases only redirects to HTTPS. Longer paths
# (/roboshop, cert-manager HTTP-01 challenges) keep their own routers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: wordpress-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-wordpress-https-redirect@kubernetescrd" .Release.Namespace | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range prepend .Values.aliases .Values.host }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port: {number: 80}
    {{- end }}
{{- end }}
