apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: wordpress-redis
spec:
  selector: {app: wordpress-redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: wordpress-redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: wordpress-redis}
  template:
    metadata:
      labels: {app: wordpress-redis}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: {{ .Values.images.redis | quote }}
          command: [sh, -ec]
          args:
            - |
              umask 077
              printf 'requirepass %s\nmaxmemory 96mb\nmaxmemory-policy allkeys-lru\nsave ""\nappendonly no\n' "$REDIS_PASSWORD" > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: wordpress-credentials, key: redis-password}
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec:
              command: [sh, -ec, 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
          livenessProbe:
            tcpSocket: {port: 6379}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
