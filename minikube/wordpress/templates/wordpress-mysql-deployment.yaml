apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: wordpress-mysql
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: wordpress-mysql}
  template:
    metadata:
      labels: {app: wordpress-mysql}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: {{ .Values.images.mysql | quote }}
          args: ["--innodb-buffer-pool-size=128M", "--max-connections=50"]
          env:
            - {name: MYSQL_DATABASE, value: wordpress}
            - {name: MYSQL_USER, value: wordpress}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: wordpress-credentials, key: database-password}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: wordpress-credentials, key: database-root-password}
          ports: [{containerPort: 3306}]
          startupProbe:
            tcpSocket: {port: 3306}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -ec, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u wordpress wordpress -e "SELECT 1"']
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 3306}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: wordpress-mysql}
