{{- if and .Values.ingress.enabled .Values.aliases }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  namespace: {{ .Release.Namespace | quote }}
  name: wordpress-alias-redirect
spec:
  # WP_HOME is https://<host>; serve aliases only as a permanent redirect there.
  redirectRegex:
    regex: {{ printf "^https?://(%s)(/.*)?$" (join "|" .Values.aliases | replace "." "\\.") | quote }}
    replacement: {{ printf "https://%s${2}" .Values.host | quote }}
    permanent: true
{{- end }}
