apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jfrog-http
  namespace: jfrog
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: jfrog-jfrog-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jfrog.jithendar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jfrog-artifactory-nginx
                port: {number: 80}
    - host: jithendar.com
      http:
        paths:
          - path: /jfrog
            pathType: Prefix
            backend:
              service:
                name: jfrog-artifactory-nginx
                port: {number: 80}
