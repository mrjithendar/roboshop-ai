apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jfrog-shortcut
  namespace: jfrog
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: jfrog-jfrog-shortcut@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jithendar.com]
      secretName: jfrog-public-tls
  rules:
    - host: jithendar.com
      http:
        paths:
          - path: /jfrog
            pathType: Prefix
            backend:
              service:
                name: jfrog-artifactory-nginx
                port: {number: 80}
