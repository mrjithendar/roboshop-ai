apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jfrog
  namespace: jfrog
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jfrog.jithendar.com]
      secretName: jfrog-public-tls
  rules:
    - host: jfrog.jithendar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jfrog-artifactory-nginx
                port: {number: 80}
