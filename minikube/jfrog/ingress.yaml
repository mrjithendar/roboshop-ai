apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jfrog-public
  namespace: jfrog
spec:
  secretName: jfrog-public-tls
  dnsNames: [jfrog.jithendar.com, jithendar.com]
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jfrog-shortcut
  namespace: jfrog
spec:
  redirectRegex:
    regex: '^https?://jithendar\.com/jfrog(/.*)?$'
    replacement: 'https://jfrog.jithendar.com/ui/'
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jfrog-https
  namespace: jfrog
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jfrog
  namespace: jfrog
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jfrog.jithendar.com]
      secretName: jfrog-public-tls
  rules:
    - host: jfrog.jithendar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jfrog-artifactory-nginx
                port: {number: 80}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jfrog-shortcut
  namespace: jfrog
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: jfrog-jfrog-shortcut@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jithendar.com]
      secretName: jfrog-public-tls
  rules:
    - host: jithendar.com
      http:
        paths:
          - path: /jfrog
            pathType: Prefix
            backend:
              service:
                name: jfrog-artifactory-nginx
                port: {number: 80}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jfrog-http
  namespace: jfrog
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: jfrog-jfrog-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: jfrog.jithendar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jfrog-artifactory-nginx
                port: {number: 80}
    - host: jithendar.com
      http:
        paths:
          - path: /jfrog
            pathType: Prefix
            backend:
              service:
                name: jfrog-artifactory-nginx
                port: {number: 80}
