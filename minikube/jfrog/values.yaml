# JFrog Container Registry: Docker/OCI, Helm and Generic file repositories.
# Requires more host capacity than the existing shared 4-vCPU/8-GB sandbox.
# Public ingress/TLS is applied separately by deploy-jfrog.sh after Helm succeeds.
artifactory:
  nginx:
    enabled: true
    https:
      enabled: false
    service:
      type: ClusterIP
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
  ingress:
    enabled: false
  artifactory:
    replicaCount: 1
    masterKeySecretName: jfrog-bootstrap
    joinKeySecretName: jfrog-bootstrap
    admin:
      secret: jfrog-bootstrap
      dataKey: bootstrap.creds
    persistence:
      enabled: true
      size: 30Gi
    resources:
      requests: {cpu: '4', memory: 6Gi}
      limits: {cpu: '4', memory: 6Gi}
    javaOpts:
      xms: 2g
      xmx: 4g
  # The parent chart requires an explicit DB secret reference in addition to
  # the PostgreSQL subchart's auth.existingSecret setting.
  database:
    secrets:
      password:
        name: jfrog-bootstrap
        key: password
  frontend:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: '1', memory: 1Gi}
  jfbus:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: '1', memory: 1Gi}
  postgresql:
    enabled: true
    auth:
      existingSecret: jfrog-bootstrap
    primary:
      persistence:
        enabled: true
        size: 10Gi
      resourcesPreset: none
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: '1', memory: 1Gi}
