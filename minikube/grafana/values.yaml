# Pinned grafana-community chart; TLS terminates at Traefik.
fullnameOverride: grafana
replicas: 1
deploymentStrategy:
  type: Recreate
service:
  type: ClusterIP
  port: 80
persistence:
  enabled: true
  size: 2Gi
  accessModes: [ReadWriteOnce]
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
# The chart generates a random admin password and reuses it on upgrades.
adminUser: admin
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts: [jithendar.com]
  path: /grafana
  pathType: Prefix
  tls:
    - secretName: jithendar-com-tls
      hosts: [jithendar.com]
# Do not strip /grafana at the ingress: Grafana handles the prefix itself.
grafana.ini:
  server:
    domain: jithendar.com
    root_url: https://jithendar.com/grafana/
    serve_from_sub_path: true
    protocol: http
  security:
    cookie_secure: true
    cookie_samesite: lax
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  analytics:
    reporting_enabled: false
    check_for_updates: false
readinessProbe:
  httpGet:
    path: /grafana/api/health
    port: grafana
livenessProbe:
  httpGet:
    path: /grafana/api/health
    port: grafana
