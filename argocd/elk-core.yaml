apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elk-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: elk
  destination:
    server: https://kubernetes.default.svc
    namespace: elk
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - FailOnSharedResource=true
    - PruneLast=true
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: observability/elk/core
