apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jfrog
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: jfrog
  destination:
    server: https://kubernetes.default.svc
    namespace: jfrog
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  sources:
  - repoURL: https://charts.jfrog.io
    chart: artifactory-jcr
    targetRevision: 107.161.26
    helm:
      releaseName: jfrog
      valueFiles:
      - $values/roboshop/minikube/jfrog/values.yaml
  - repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    ref: values
