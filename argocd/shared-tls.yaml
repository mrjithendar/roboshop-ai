apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-tls
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: jithendar
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  source:
    repoURL: https://github.com/mrjithendar/jithendar.com.git
    targetRevision: master
    path: shared-tls
    directory:
      include: tlsstore.yaml
