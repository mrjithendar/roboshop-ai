apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  sources:
  - repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.0.1
    helm:
      releaseName: grafana
      valueFiles:
      - $values/observability/grafana/values.yaml
  - repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    ref: values
  - repoURL: https://github.com/mrjithendar/tools.git
    targetRevision: master
    path: observability/grafana/dashboards
