apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elk-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: elk
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - FailOnSharedResource=true
    - PruneLast=true
  sources:
  - repoURL: https://helm.elastic.co
    chart: eck-operator
    targetRevision: 3.5.0
    helm:
      releaseName: elastic-operator
      valueFiles:
      - $values/observability/elk/operator/values.yaml
  - repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    ref: values
