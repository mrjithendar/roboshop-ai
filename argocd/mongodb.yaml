apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: roboshop-ai
  # Operational rollout timestamps do not change the desired database configuration.
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: mongodb
    namespace: roboshop-ai
    jsonPointers:
    - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
    # Normalize the empty map left after excluding the timestamp.
    jqPathExpressions:
    - .spec.template.metadata.annotations | select(. == {})
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
  # Live controller is a Deployment; services/mongodb's StatefulSet needs a data migration first.
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: minikube/mongodb
    directory:
      include: '{mongodb-data-pvc.yaml,mongodb-service.yaml,mongodb-catalog-configmap.yaml,mongodb-deployment.yaml}'
