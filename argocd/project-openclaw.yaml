apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: openclaw
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/mrjithendar/roboshop-ai.git
  destinations:
  - namespace: openclaw
    server: https://kubernetes.default.svc
  - namespace: roboshop-ai
    server: https://kubernetes.default.svc
  - namespace: argocd
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: networking.k8s.io
    kind: Ingress
  - group: traefik.io
    kind: Middleware
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
