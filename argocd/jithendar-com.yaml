apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jithendar-com
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: jithendar
  # Auto-sync is the release path: CI commits a new image digest and Argo CD applies it.
  # Pruning stays off (deletions are manual); selfHeal is off so manual hotfixes are visible as OutOfSync.
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: sites/jithendar-com/deploy/production
