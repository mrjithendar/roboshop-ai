apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: jfrog
  namespace: argocd
spec:
  description: Optional JFrog chart; permits its generated configuration Secret only
    within jfrog
  sourceRepos:
  - https://github.com/mrjithendar/roboshop-ai.git
  - https://charts.jfrog.io
  destinations:
  - namespace: jfrog
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
