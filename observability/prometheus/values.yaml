image: prom/prometheus:v3.15.0
storage: 5Gi
# Minikube hostPath-backed storage may not apply fsGroup ownership automatically.
volumePermissions:
  enabled: true
  image: busybox:1.37.0
retentionTime: 7d
retentionSize: 4GB
# Discover nodes and collect kubelet/container metrics through the authenticated API proxy.
kubernetesMetrics:
  enabled: true
# Add Kubernetes-reachable scrape jobs here. Use Kubernetes service DNS names.
# Only services whose /metrics endpoint answers are listed; files/alerts.yml uses these job names.
extraScrapeConfigs:
  - job_name: roboshop
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-gateway.roboshop-ai.svc.cluster.local:3000
          - cart-service.roboshop-ai.svc.cluster.local:4107
          - catalogue-service.roboshop-ai.svc.cluster.local:4108
          - currency-service.roboshop-ai.svc.cluster.local:4111
          - moks.roboshop-ai.svc.cluster.local:4103
          - payment-service.roboshop-ai.svc.cluster.local:4105
          - shipping-service.roboshop-ai.svc.cluster.local:4106
          - user-service.roboshop-ai.svc.cluster.local:4109
  - job_name: loki
    static_configs:
      - targets: ["loki.monitoring.svc.cluster.local:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy.monitoring.svc.cluster.local:12345"]

# Minikube hostPath data lives on this node; move only together with the data.
nodeSelector:
  kubernetes.io/hostname: mk4-m02
