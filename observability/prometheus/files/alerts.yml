groups:
  - name: roboshop
    rules:
      - alert: RoboShopServiceDown
        expr: up{job="roboshop"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'RoboShop service {{ $labels.instance }} is not responding'
      - alert: RoboShopHighErrorRatio
        expr: sum by (service) (rate(roboshop_http_requests_total{status=~"5.."}[5m])) / sum by (service) (rate(roboshop_http_requests_total[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'More than 10% of {{ $labels.service }} requests fail'
      - alert: RoboShopHighLatency
        expr: histogram_quantile(0.95, sum by (service, route, le) (rate(http_server_request_duration_seconds_bucket{job="roboshop", route!=""}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }} {{ $labels.route }} p95 latency is above 2s'
  - name: observability
    rules:
      - alert: ObservabilityTargetDown
        expr: up{job=~"loki|alloy"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} is not responding; logs may not be collected'
