global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: robotshop
    static_configs:
      - targets:
          - ai-gateway:3000
          - product-ingestion:4101
          - recommendation-service:4102
          - shopping-agent:4103
          - sre-copilot:4104
          - payment-service:4105
          - shipping-service:4106
