groups:
  - name: robotshop
    rules:
      - alert: RobotShopServiceDown
        expr: up{job="robotshop"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'RobotShop service {{ $labels.instance }} is not responding'
      - alert: RobotShopHighErrorRatio
        expr: sum by (service) (rate(robotshop_http_requests_total{status=~"5.."}[5m])) / sum by (service) (rate(robotshop_http_requests_total[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'More than 10% of {{ $labels.service }} requests fail'
