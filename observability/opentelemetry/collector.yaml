receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  attributes/privacy:
    actions:
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: client.address
        action: delete
      - key: network.peer.address
        action: delete
      - key: enduser.id
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: exception.message
        action: delete
      - key: exception.stacktrace
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
  filter/routine:
    error_mode: ignore
    trace_conditions:
      - 'span.attributes["http.route"] != nil and IsMatch(span.attributes["http.route"], "^/(health(/live|/ready)?|ready|metrics|api/[^/]+/ready)$") and span.status.code != STATUS_CODE_ERROR and ((span.attributes["http.response.status_code"] != nil and span.attributes["http.response.status_code"] < 400) or (span.attributes["http.status_code"] != nil and span.attributes["http.status_code"] < 400))'
      # Keep error status/type; exception events can contain SQL, addresses or secrets.
      - 'spanevent.name == "exception"'
  batch:
    timeout: 2s
exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, filter/routine, batch]
      exporters: [otlphttp/jaeger]
