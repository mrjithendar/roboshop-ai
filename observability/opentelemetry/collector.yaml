receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  attributes/privacy:
    actions:
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: client.address
        action: delete
      - key: network.peer.address
        action: delete
      - key: enduser.id
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
  batch:
    timeout: 2s
exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/jaeger]
