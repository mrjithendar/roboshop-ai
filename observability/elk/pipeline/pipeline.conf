input {
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/tls/tls.crt"
    ssl_key => "/tls/tls.key"
    ssl_certificate_authorities => ["/tls/ca.crt"]
    ssl_client_authentication => "required"
    enrich => "none"
  }
}
filter {
  ruby { path => "/parser/normalize.rb" }
}
output {
  elasticsearch {
    hosts => ["https://logs-es-http.els.svc:9200"]
    user => "elk_ingest"
    password => "${INGEST_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/es-ca/ca.crt"]
    ssl_verification_mode => "full"
    manage_template => false
    ilm_enabled => false
    data_stream => false
    action => "create"
    index => "%{[@metadata][target]}"
    pipeline => "roboshop-timestamps"
  }
}
