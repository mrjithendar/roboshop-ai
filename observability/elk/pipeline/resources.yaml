apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: els
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elk-pod-metadata
  namespace: roboshop-ai
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elk-pod-metadata
  namespace: roboshop-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: elk-pod-metadata
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: els
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elk-pod-metadata
  namespace: traefik
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elk-pod-metadata
  namespace: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: elk-pod-metadata
subjects:
- kind: ServiceAccount
  name: filebeat
  namespace: els
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logstash-data
  namespace: els
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: els
spec:
  selector:
    app: elk-logstash
  ports:
  - name: beats
    port: 5044
    targetPort: beats
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: els
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elk-logstash
  template:
    metadata:
      labels:
        app: elk-logstash
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 120
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:9.5.5
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: '1'
            memory: 1536Mi
        env:
        - name: LS_JAVA_OPTS
          value: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
        - name: INGEST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: els-credentials
              key: ingestPassword
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
        ports:
        - name: beats
          containerPort: 5044
        - name: api
          containerPort: 9600
        volumeMounts:
        - name: pipeline
          mountPath: /usr/share/logstash/pipeline
          readOnly: true
        - name: settings
          mountPath: /usr/share/logstash/config/logstash.yml
          subPath: logstash.yml
          readOnly: true
        - name: parser
          mountPath: /parser
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: es-ca
          mountPath: /es-ca
          readOnly: true
        - name: data
          mountPath: /usr/share/logstash/data
        startupProbe:
          httpGet:
            path: /
            port: api
          periodSeconds: 10
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: beats
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: api
          periodSeconds: 30
          failureThreshold: 5
      volumes:
      - name: pipeline
        configMap:
          name: logstash-pipeline
      - name: parser
        configMap:
          name: elk-parser
      - name: settings
        configMap:
          name: logstash-settings
      - name: tls
        secret:
          secretName: logstash-server-tls
      - name: es-ca
        secret:
          secretName: logs-es-http-certs-public
      - name: data
        persistentVolumeClaim:
          claimName: logstash-data
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: els
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  selector:
    matchLabels:
      app: elk-filebeat
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: elk-filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      tolerations:
      - operator: Exists
        effect: NoSchedule
      containers:
      - name: filebeat
        image: docker.elastic.co/beats/filebeat:9.5.5
        args:
        - -e
        - -c
        - /etc/filebeat/filebeat.yml
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsUser: 0
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: filebeat-config
          mountPath: /etc/filebeat
          readOnly: true
        - name: containers
          mountPath: /var/log/containers
          readOnly: true
        - name: pods
          mountPath: /var/log/pods
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: registry
          mountPath: /usr/share/filebeat/data
        readinessProbe:
          exec:
            command:
            - filebeat
            - test
            - config
            - -c
            - /etc/filebeat/filebeat.yml
          periodSeconds: 30
          timeoutSeconds: 5
        startupProbe:
          exec:
            command:
            - filebeat
            - test
            - config
            - -c
            - /etc/filebeat/filebeat.yml
          periodSeconds: 10
          failureThreshold: 12
      volumes:
      - name: filebeat-config
        configMap:
          name: filebeat-config
      - name: tls
        secret:
          secretName: filebeat-client-tls
      - name: containers
        hostPath:
          path: /var/log/containers
          type: Directory
      - name: pods
        hostPath:
          path: /var/log/pods
          type: Directory
      - name: registry
        hostPath:
          path: /var/lib/roboshop-filebeat
          type: DirectoryOrCreate
