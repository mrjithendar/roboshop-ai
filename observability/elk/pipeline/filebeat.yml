filebeat.inputs:
- type: filestream
  id: elk-roboshop-ai
  paths:
  - /var/log/containers/*_roboshop-ai_*.log
  prospector.scanner.symlinks: true
  prospector.scanner.fingerprint.length: 64
  message_max_bytes: 65536
  parsers:
  - container:
      stream: all
      format: auto
  - multiline:
      type: pattern
      pattern: '^[\t ]+(at |\.\.\.)|^Caused by:|^Suppressed:'
      negate: false
      match: after
      max_lines: 100
      timeout: 3s
  processors:
  - add_kubernetes_metadata:
      host: ${NODE_NAME}
      namespace: roboshop-ai
      scope: node
      add_resource_metadata:
        node:
          enabled: false
        namespace:
          enabled: false
        deployment: false
        cronjob: false
      matchers:
      - logs_path:
          logs_path: /var/log/containers/
- type: filestream
  id: elk-traefik
  paths:
  - /var/log/containers/*_traefik_*.log
  prospector.scanner.symlinks: true
  prospector.scanner.fingerprint.length: 64
  message_max_bytes: 65536
  parsers:
  - container:
      stream: all
      format: auto
  - multiline:
      type: pattern
      pattern: '^[\t ]+(at |\.\.\.)|^Caused by:|^Suppressed:'
      negate: false
      match: after
      max_lines: 100
      timeout: 3s
  processors:
  - add_kubernetes_metadata:
      host: ${NODE_NAME}
      namespace: traefik
      scope: node
      add_resource_metadata:
        node:
          enabled: false
        namespace:
          enabled: false
        deployment: false
        cronjob: false
      matchers:
      - logs_path:
          logs_path: /var/log/containers/
queue.mem:
  events: 1024
  flush.min_events: 128
output.logstash:
  hosts:
  - logstash.els.svc:5044
  ssl.certificate_authorities:
  - /tls/ca.crt
  ssl.certificate: /tls/tls.crt
  ssl.key: /tls/tls.key
  ssl.verification_mode: full
  bulk_max_size: 128
  worker: 1
logging.to_files: false
logging.to_stderr: true
logging.level: warning
http.enabled: true
http.host: 127.0.0.1
http.port: 5066
filebeat.registry.flush: 1s
shutdown_timeout: 20s
processors:
- drop_fields:
    fields:
    - agent
    - ecs
    - host
    - input
    - log.file
    - container.image
    - kubernetes.labels
    - kubernetes.annotations
    ignore_missing: true
