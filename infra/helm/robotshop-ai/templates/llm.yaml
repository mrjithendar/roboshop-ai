apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-shopping-agent
  annotations:
    {{- toYaml .Values.llm.serviceAccountAnnotations | nindent 4 }}
automountServiceAccountToken: {{ .Values.llm.workloadIdentityEnabled }}
{{- if .Values.llm.networkPolicyEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-shopping-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: shopping-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: ai-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: sre-copilot
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 4103
{{- end }}
