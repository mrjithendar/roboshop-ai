# Service settings live in services/<name>/compose.yml.
name: robotshop-ai
services:
  product-ingestion:
    extends:
      file: services/product-ingestion/compose.yml
      service: product-ingestion
  recommendation-service:
    extends:
      file: services/recommendation-service/compose.yml
      service: recommendation-service
  shopping-agent:
    extends:
      file: services/shopping-agent/compose.yml
      service: shopping-agent
  sre-copilot:
    extends:
      file: services/sre-copilot/compose.yml
      service: sre-copilot
  ai-gateway:
    extends:
      file: services/ai-gateway/compose.yml
      service: ai-gateway
  otel-collector:
    extends:
      file: services/otel-collector/compose.yml
      service: otel-collector
  jaeger:
    extends:
      file: services/jaeger/compose.yml
      service: jaeger
  prometheus:
    extends:
      file: services/prometheus/compose.yml
      service: prometheus
  payment-service:
    extends:
      file: services/payment-service/compose.yml
      service: payment-service
  shipping-service:
    extends:
      file: services/shipping-service/compose.yml
      service: shipping-service
  shipping-db:
    extends:
      file: services/postgres/compose.yml
      service: shipping-db
  redis:
    extends:
      file: services/redis/compose.yml
      service: redis
  rabbitmq:
    extends:
      file: services/rabbitmq/compose.yml
      service: rabbitmq
  frontend:
    extends:
      file: services/frontend/compose.yml
      service: frontend
  nginx:
    extends:
      file: services/nginx/compose.yml
      service: nginx
  mcp-server:
    extends:
      file: services/mcp-server/compose.yml
      service: mcp-server
  mongodb:
    extends:
      file: services/mongodb/compose.yml
      service: mongodb
volumes:
  shop-data: {}
  prometheus-data: {}
  shipping-postgres: {}
  rabbitmq-data: {}
  mongo-data: {}
