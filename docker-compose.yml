name: robotshop-ai
services:
  product-ingestion:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/product-ingestion/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      PAYMENT_URL: http://payment-service:4105
      MONGODB_URL: mongodb://robotshop:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}@mongodb:27017/robotshop?authSource=robotshop
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      mongodb:
        condition: service_healthy
  recommendation-service:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/recommendation-service/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      PAYMENT_URL: http://payment-service:4105
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      product-ingestion:
        condition: service_healthy
  shopping-agent:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/shopping-agent/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      PAYMENT_URL: http://payment-service:4105
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      product-ingestion:
        condition: service_healthy
  sre-copilot:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/sre-copilot/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      PAYMENT_URL: http://payment-service:4105
      SHIPPING_URL: http://shipping-service:4106
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4104/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  ai-gateway:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/ai-gateway/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ASSISTANT_AI_ENABLED: ${ASSISTANT_AI_ENABLED:-false}
      PAYMENT_URL: http://payment-service:4105
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-}
      SHIPPING_URL: http://shipping-service:4106
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD:?Set
        RABBITMQ_PASSWORD}@rabbitmq:5672
      TRUST_PROXY: 'true'
      MONGODB_URL: mongodb://robotshop:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}@mongodb:27017/robotshop?authSource=robotshop
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - shop-data:/app/.data
    depends_on:
      product-ingestion:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      shopping-agent:
        condition: service_healthy
      sre-copilot:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0-386
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - ./observability/opentelemetry/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
    - 127.0.0.1:4318:4318
    depends_on:
    - jaeger
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
    - 127.0.0.1:16686:16686
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
    - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    - prometheus-data:/prometheus
    ports:
    - 127.0.0.1:9090:9090
  payment-service:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/payment-service/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      PAYMENT_URL: http://payment-service:4105
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:-}
      PAYMENT_MODE: ${PAYMENT_MODE:-live}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4105/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  shipping-service:
    build:
      context: .
      dockerfile: services/shipping-service/Dockerfile
    image: robotshop-shipping:local
    command: []
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      SHIPPING_DATABASE_URL: postgresql://shipping_app:${SHIPPING_APP_PASSWORD:?Set
        SHIPPING_APP_PASSWORD}@shipping-db:5432/shipping
      SHIPPING_DB_TLS: 'false'
      SHIPPING_TRACING_ENABLED: 'true'
      CACHE_ENABLED: 'true'
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      MESSAGING_ENABLED: 'true'
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      SHIPPING_MIGRATION_DATABASE_URL: postgresql://shipping:${SHIPPING_DB_PASSWORD:?Set
        SHIPPING_DB_PASSWORD}@shipping-db:5432/shipping
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:4106/api/shipping/ready
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      shipping-db:
        condition: service_healthy
    tmpfs:
    - /tmp
  shipping-db:
    extends:
      file: services/postgres/compose.yml
      service: shipping-db
  redis:
    extends:
      file: services/redis/compose.yml
      service: redis
  rabbitmq:
    extends:
      file: services/rabbitmq/compose.yml
      service: rabbitmq
  nginx:
    extends:
      file: services/nginx/compose.yml
      service: nginx
  mongodb:
    extends:
      file: services/mongodb/compose.yml
      service: mongodb
volumes:
  shop-data: {}
  prometheus-data: {}
  shipping-postgres: {}
  rabbitmq-data: {}
  mongo-data: {}
