# Modern local demo. Legacy stack: docker compose -f docker-compose.legacy.yml up --build
name: robotshop-ai
services:
  product-ingestion:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/product-ingestion/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  recommendation-service:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/recommendation-service/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      product-ingestion:
        condition: service_healthy
  shopping-agent:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/shopping-agent/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      product-ingestion:
        condition: service_healthy
  sre-copilot:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/sre-copilot/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4104/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  ai-gateway:
    build: .
    image: robotshop-ai:local
    command:
    - node
    - services/ai-gateway/server.mjs
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ASSISTANT_AI_ENABLED: ${ASSISTANT_AI_ENABLED:-false}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
    - 127.0.0.1:3000:3000
    volumes:
    - shop-data:/app/.data
    depends_on:
      product-ingestion:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy
      shopping-agent:
        condition: service_healthy
      sre-copilot:
        condition: service_healthy
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0-386
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - ./observability/opentelemetry/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
    - 127.0.0.1:4318:4318
    depends_on:
    - jaeger
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
    - 127.0.0.1:16686:16686
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
    - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    - prometheus-data:/prometheus
    ports:
    - 127.0.0.1:9090:9090
volumes:
  shop-data: {}
  prometheus-data: {}
