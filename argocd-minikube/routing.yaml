apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-routing
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-minikube
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: roboshop
  destination:
    server: https://kubernetes.default.svc
    namespace: roboshop-ai
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  # Traefik route for https://jithendar.com/roboshop.
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: argocd-minikube/apps/routing
