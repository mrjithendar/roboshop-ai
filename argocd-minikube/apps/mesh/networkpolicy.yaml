# kafka-internal and mcp-server-clients isolate ingress for kafka and mcp-server. Prometheus (outside the mesh)
# also needs the sidecar's ports there: 15020 for merged metrics and health, 15090 for Envoy's own (job
# envoy-stats). No pod here is egress-isolated, so the sidecars already reach istiod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: istio-sidecars
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [kafka, mcp-server]
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - {port: 15020, protocol: TCP}
    - {port: 15090, protocol: TCP}
