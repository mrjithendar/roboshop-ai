# STRICT: only pods with a sidecar can connect. Every caller on mk4 is meshed (the Istio gateway, Prometheus), so no
# port is left PERMISSIVE. The mesh-wide default is STRICT too (miniKube istio/mesh); this keeps it if that changes.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: STRICT
