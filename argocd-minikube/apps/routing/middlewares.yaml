# web serves from /, so Traefik strips /roboshop (see services/web/nginx/README.md).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: roboshop-strip-prefix
spec:
  stripPrefix:
    prefixes:
    - /roboshop
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
