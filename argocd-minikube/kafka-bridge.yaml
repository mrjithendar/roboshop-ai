apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-kafka-bridge
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-minikube
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: roboshop
  destination:
    server: https://kubernetes.default.svc
    namespace: roboshop-ai
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  # mk4 has only the minikube-hostpath "standard" StorageClass; the manifests ask for EKS gp3-encrypted.
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: services/kafka-bridge
    kustomize:
      patches:
      - target:
          kind: StatefulSet
          name: kafka
        patch: |-
          - op: replace
            path: /spec/volumeClaimTemplates/0/spec/storageClassName
            value: standard
