name: frontend image

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'services/frontend/**'
      - '.github/workflows/ci-frontend.yml'
      - '.github/workflows/publish-ecr.yml'
      - 'services/frontend/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-ecr.yml
    with:
      service: frontend
