name: currency-service image

on:
  workflow_dispatch:
  push:
    # branches: [master, main]
    paths:
      - 'services/currency-service/**'
      - '.github/workflows/ci-currency-service.yml'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - run: go test -race ./...
        working-directory: services/currency-service
  publish:
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-ecr.yml
    with:
      service: currency-service
