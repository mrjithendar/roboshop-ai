name: currency-service image

on:
  workflow_dispatch:
  push:
    # branches: [master, main]
    paths:
      - 'services/currency-service/**'
      - '.github/workflows/ci-currency-service.yml'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Ensure C compiler for Go race detector
        shell: bash
        run: |
          set -euo pipefail
          if command -v gcc >/dev/null 2>&1; then
            gcc --version
            exit 0
          fi
          elevate=()
          if [[ "$(id -u)" != 0 ]]; then
            sudo -n true
            elevate=(sudo -n)
          fi
          if command -v dnf >/dev/null 2>&1; then
            "${elevate[@]}" dnf install -y gcc
          elif command -v yum >/dev/null 2>&1; then
            "${elevate[@]}" yum install -y gcc
          elif command -v apt-get >/dev/null 2>&1; then
            "${elevate[@]}" apt-get update
            "${elevate[@]}" apt-get install -y build-essential
          elif command -v zypper >/dev/null 2>&1; then
            "${elevate[@]}" zypper --non-interactive install gcc glibc-devel
          else
            echo "No supported package manager found to install GCC." >&2
            exit 1
          fi
          gcc --version
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: go test -race ./...
        working-directory: services/currency-service
  publish:
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-ecr.yml
    with:
      service: currency-service
