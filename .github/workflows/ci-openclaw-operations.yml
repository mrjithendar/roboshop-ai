name: OpenClaw operations image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - name: Isolate Docker credentials
        run: |
          config_dir=$(mktemp -d "$RUNNER_TEMP/openclaw-docker.XXXXXX")
          echo "DOCKER_CONFIG=$config_dir" >> "$GITHUB_ENV"
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: services/mcp-server
          file: services/mcp-server/Dockerfile.operations
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/roboshop-mcp-server:openclaw-${{ github.sha }}
      - name: Record immutable image for reviewed GitOps update
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/roboshop-mcp-server
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Use `%s@%s` for the operations container and telemetry initContainer in the mk4 overlay.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
