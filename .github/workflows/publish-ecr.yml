name: Publish service image to ECR

on:
  workflow_call:
    inputs:
      service:
        description: Service directory containing the Dockerfile
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      SERVICE: ${{ inputs.service }}
      AWS_REGION: us-east-1
      REPOSITORY_PREFIX: robotshop
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate configuration and name image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$SERVICE" in
            user-service|cart-service|ai-gateway|product-ingestion|catalogue-service|recommendation-service|shopping-agent|sre-copilot|payment-service|mcp-server|shipping-service|frontend|nginx|finder|currency-service|fastapi-demo) ;;
            *) echo 'Unsupported service' >&2; exit 1 ;;
          esac
          [[ "$REPOSITORY_PREFIX" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || { echo 'Invalid ECR_REPOSITORY_PREFIX' >&2; exit 1; }
          suffix="$SERVICE"
          [[ "$SERVICE" != shipping-service ]] || suffix=shipping
          echo "repository=$REPOSITORY_PREFIX-$suffix" >> "$GITHUB_OUTPUT"
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          test -f "services/$SERVICE/Dockerfile"

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4
      - name: Build and push service Dockerfile
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/${{ inputs.service }}
          file: services/${{ inputs.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - name: Record published image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ steps.image.outputs.repository }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### %s\n\nImage: `%s:%s`\n\nDigest: `%s@%s`\n' "$SERVICE" "$IMAGE" "$TAG" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
