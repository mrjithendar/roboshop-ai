name: Publish service image to ECR

on:
  workflow_call:
    inputs:
      service:
        description: Service directory containing the Dockerfile
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      SERVICE: ${{ inputs.service }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'robotshop' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate configuration and name image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${AWS_ROLE_ARN:?Set the AWS_ROLE_ARN repository variable}"
          case "$SERVICE" in
            cart-service|ai-gateway|product-ingestion|catalogue-service|recommendation-service|shopping-agent|sre-copilot|payment-service|mcp-server|shipping-service|frontend|nginx|finder) ;;
            *) echo 'Unsupported service' >&2; exit 1 ;;
          esac
          [[ "$REPOSITORY_PREFIX" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || { echo 'Invalid ECR_REPOSITORY_PREFIX' >&2; exit 1; }
          suffix="$SERVICE"
          [[ "$SERVICE" != shipping-service ]] || suffix=shipping
          echo "repository=$REPOSITORY_PREFIX-$suffix" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          test -f "services/$SERVICE/Dockerfile"
      - name: Assume AWS publishing role using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Check repository exists
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
        run: aws ecr describe-repositories --repository-names "$REPOSITORY" > /dev/null
      - uses: docker/setup-buildx-action@v4
      - name: Build and push service Dockerfile
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/${{ inputs.service }}
          file: services/${{ inputs.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - name: Record published image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ steps.image.outputs.repository }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### %s\n\nImage: `%s:%s`\n\nDigest: `%s@%s`\n' "$SERVICE" "$IMAGE" "$TAG" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
