name: jithendar.com

# check   → lint, typecheck, test, build, render manifests (every push and PR)
# publish → build the arm64 image and push it to ECR as jithendar-com:<commit-sha> (default branch only)
#
# CI does not deploy and has no cluster access. sites/deploy.sh resolves the image digest
# from ECR, pins it in deploy/production and applies it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sites/jithendar-com/**'
      - '.github/workflows/ci-jithendar-com.yml'
  push:
    paths:
      - 'sites/jithendar-com/**'
      - '.github/workflows/ci-jithendar-com.yml'

permissions:
  contents: read

# Builds for the same ref run one at a time.
concurrency:
  group: jithendar-com-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: sites/jithendar-com

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: sites/jithendar-com/.nvmrc
          cache: npm
          cache-dependency-path: sites/jithendar-com/package-lock.json
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.0
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # On master the publish job builds the same code moments later; PRs still verify the build here.
      - if: github.event_name == 'pull_request'
        run: npm run build
        env:
          APP_ENV: production
      - name: Render production manifests
        run: kubectl kustomize deploy/production > /dev/null

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      REPOSITORY: jithendar-com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Concurrent runners share HOME; isolate Docker login and buildx settings.
      - name: Isolate Docker configuration for this job
        run: echo "DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")" >> "$GITHUB_ENV"
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      # The runner's own Docker engine (default "docker" driver): image layers and BuildKit cache mounts
      # stay on the runner's disk between builds, instead of round-tripping through the GitHub cache
      # service (that transfer was ~2 of the 3 minutes).
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: sites/jithendar-com
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_ENV=production
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
      - name: Keep the runner's build cache bounded
        if: always()
        run: docker builder prune --force --keep-storage 10GB >/dev/null || true
      - name: Record image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### jithendar.com image'
            echo
            echo "- Tag: \`$IMAGE:$GITHUB_SHA\`"
            echo "- Digest: \`$IMAGE@$DIGEST\`"
            echo
            echo "Deploy: \`sites/deploy.sh $GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
