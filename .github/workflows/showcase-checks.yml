name: Robotics showcase checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGODB_URL: mongodb://127.0.0.1:27017
      APP_ENV: development
      REGISTRATION_CHALLENGE_PROVIDER: disabled
      AWS_EC2_METADATA_DISABLED: 'true'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - run: python -m pip install -r services/user-service/requirements.txt -r services/ai-gateway/requirements.txt -r services/moks/requirements.txt -r tests/python/requirements.txt
      - run: python -m unittest discover -s tests/python -v
      - run: python -m unittest discover -s services/ai-gateway/tests -v
      - run: python -m unittest discover -s services/user-service/tests -v
      - run: python -m unittest discover -s services/moks/tests -v
      - run: node --check services/moks/widget.js
      - run: python scripts/test/evaluate.py
      - run: npm ci --ignore-scripts
      - run: npm run frontend:build
      - run: node --test tests/showcase-ui.test.mjs services/frontend/tests/frontend.test.mjs services/frontend/tests/admin-ui.test.mjs tests/catalogue.test.mjs tests/auth.test.mjs services/moks/tests/widget.test.mjs
