name: Publish service image to Harbor

on:
  workflow_call:
    inputs:
      service:
        description: Service directory containing the Dockerfile
        required: true
        type: string
    secrets:
      # Harbor robot robot$jithendar+roboshop-ai (push and pull in project jithendar only), set by the tools
      # repository's deploy/minikube/harbor/registry.py ci-robots. Callers pass them with "secrets: inherit".
      HARBOR_USERNAME:
        required: true
      HARBOR_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 30
    env:
      SERVICE: ${{ inputs.service }}
      REGISTRY: registry.jithendar.com/jithendar
      REPOSITORY_PREFIX: roboshop
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate configuration and name image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$(docker info --format '{{.Architecture}}')" in
            arm64|aarch64) ;;
            *) echo 'ARM64 Docker engine required.' >&2; exit 1 ;;
          esac
          case "$SERVICE" in
            user-service|cart-service|ai-gateway|catalogue-service|moks|payment-service|mcp-server|shipping-service|web|currency-service|kafka-bridge) ;;
            *) echo 'Unsupported service' >&2; exit 1 ;;
          esac
          [[ "$REPOSITORY_PREFIX" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || { echo 'Invalid REPOSITORY_PREFIX' >&2; exit 1; }
          suffix="$SERVICE"
          [[ "$SERVICE" != shipping-service ]] || suffix=shipping
          echo "repository=$REPOSITORY_PREFIX-$suffix" >> "$GITHUB_OUTPUT"
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          test -f "services/$SERVICE/Dockerfile"

      - name: Verify Node HTTP logging before publishing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "services/$SERVICE/lib/runtime.mjs" ]]; then
            docker run --platform linux/arm64 --rm -v "$PWD:/workspace:ro" -w /workspace node:26-alpine \
              node --test tests/http-logging.test.mjs
          fi

      # Concurrent runners share HOME; isolate login/logout and buildx settings.
      - name: Isolate Docker configuration for this job
        shell: bash
        run: |
          set -euo pipefail
          config_dir=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")
          echo "DOCKER_CONFIG=$config_dir" >> "$GITHUB_ENV"

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin

      - uses: docker/setup-buildx-action@v4
        id: buildx
      - name: Build and push service Dockerfile
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: services/${{ inputs.service }}
          file: services/${{ inputs.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - name: Record published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.repository }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### %s\n\nImage: `%s:%s`\n\nDigest: `%s@%s`\n' "$SERVICE" "$IMAGE" "$TAG" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
