name: mcp-server image

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/mcp-server/**'
      - '.github/workflows/ci-mcp-server.yml'

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish-image.yml
    secrets: inherit
    with:
      service: mcp-server
