name: mcp-server image

on:
  workflow_dispatch:
  push:
    # branches: [master, main]
    paths:
      - 'services/mcp-server/**'
      - '.github/workflows/ci-mcp-server.yml'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-image.yml
    secrets: inherit
    with:
      service: mcp-server
