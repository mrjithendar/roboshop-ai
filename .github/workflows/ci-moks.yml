name: moks image

on:
  workflow_dispatch:
  push:
    # branches: [master, main]
    paths:
      - 'services/moks/**'
      - '.github/workflows/ci-moks.yml'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-image.yml
    secrets: inherit
    with:
      service: moks
