name: web image

on:
  workflow_dispatch:
  push:
    # branches: [master, main]
    # Storefront source and NGINX configuration ship in one image.
    paths:
      - 'services/web/**'
      - '.github/workflows/ci-web.yml'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-image.yml
    secrets: inherit
    with:
      service: web
