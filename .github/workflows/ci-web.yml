name: web image

on:
  workflow_dispatch:
  push:
    # Storefront source and NGINX configuration ship in one image.
    paths:
      - 'services/web/**'
      - '.github/workflows/ci-web.yml'

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish-image.yml
    secrets: inherit
    with:
      service: web
