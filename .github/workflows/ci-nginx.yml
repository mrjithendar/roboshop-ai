name: nginx image

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    # paths:
    #   - 'services/nginx/**'
    #   - '.dockerignore'
    #   - '.github/workflows/ci-nginx.yml'
    #   - '.github/workflows/publish-ecr.yml'
    #   - 'package.json'
    #   - 'package-lock.json'
    #   - 'services/frontend/**'
    #   - 'scripts/build-frontend.mjs'
    #   - 'legacy/original-robotshop/web/static/images/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-ecr.yml
    with:
      service: nginx
