name: nginx image

on:
  workflow_dispatch:
  push:
    # branches: [master, main]
    paths:
      - 'services/nginx/**'
      - '.github/workflows/ci-nginx.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-ecr.yml
    with:
      service: nginx
