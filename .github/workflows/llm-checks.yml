name: LLM configuration checks
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - 'services/ai-gateway/**'
  #     - 'services/moks/**'
  #     - 'services/web/frontend/**'
  #     - 'tests/**'
  #     - '.github/workflows/llm-checks.yml'
  # push:
  #   # branches: [master, main]
  #   paths:
  #     - 'services/ai-gateway/**'
  #     - 'services/moks/**'
  #     - 'services/web/frontend/**'
  #     - 'tests/**'
  #     - '.github/workflows/llm-checks.yml'
permissions:
  contents: read
jobs:
  mocked-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - run: python -m pip install -r services/user-service/requirements.txt -r services/ai-gateway/requirements.txt -r services/moks/requirements.txt -r tests/python/requirements.txt
      - run: python -m unittest discover -s tests/python -v
      - run: python -m unittest discover -s services/ai-gateway/tests -v
      - run: python -m unittest discover -s services/user-service/tests -v
      - run: npm ci
      - run: npm run frontend:build
      - run: node --test services/web/frontend/tests/admin-ui.test.mjs services/web/frontend/tests/frontend.test.mjs
