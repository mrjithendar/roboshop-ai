name: LLM configuration checks
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - 'services/ai-gateway/**'
  #     - 'services/shopping-agent/**'
  #     - 'services/frontend/**'
  #     - 'tests/**'
  #     - '.github/workflows/llm-checks.yml'
  # push:
  #   branches: [master, main]
  #   paths:
  #     - 'services/ai-gateway/**'
  #     - 'services/shopping-agent/**'
  #     - 'services/frontend/**'
  #     - 'tests/**'
  #     - '.github/workflows/llm-checks.yml'
permissions:
  contents: read
jobs:
  mocked-providers:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: python -m pip install -r services/ai-gateway/requirements.txt -r services/shopping-agent/requirements.txt -r tests/python/requirements.txt
      - run: python -m unittest discover -s tests/python -v
      - run: python scripts/evaluate.py
      - run: npm ci
      - run: npm run frontend:build
      - run: node --test services/frontend/tests/admin-ui.test.mjs services/frontend/tests/frontend.test.mjs
