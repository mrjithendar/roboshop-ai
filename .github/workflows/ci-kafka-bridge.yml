name: kafka-bridge image
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/kafka-bridge/**'
      - '.github/workflows/ci-kafka-bridge.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target test services/kafka-bridge
  publish:
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-ecr.yml
    with:
      service: kafka-bridge
