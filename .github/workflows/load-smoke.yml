name: Isolated mocked load smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/load/**'
      - 'services/ai-gateway/**'
      - 'services/moks/**'
      - 'services/user-service/**'
      - 'services/payment-service/**'
      - '.github/workflows/load-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
      - name: Install isolated test dependencies and pinned k6
        run: |
          python -m venv tests/load/.venv
          tests/load/.venv/bin/pip install -r tests/load/requirements.txt
          tests/load/.venv/bin/python tests/load/install-k6.py
      - name: Test guards and mock protocols
        run: tests/load/.venv/bin/python -m unittest discover -s tests/load -p 'test_*.py'
      - name: Small mocked journeys (no cloud credentials)
        env:
          WARMUP_SECONDS: '1'
          PACE_SECONDS: '1'
        run: |
          set -euo pipefail
          for scenario in browse session cart idempotency chat isolation limited-stock; do
            tests/load/.venv/bin/python tests/load/lab.py run --run-id "load-ci-${scenario}" --scenario "$scenario" --seconds 2 --vus 1 --k6 tests/load/.tools/k6
          done
      - name: Upload sanitized summaries only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mocked-load-results
          path: |
            tests/load/.runs/*/summary.json
            tests/load/.runs/*/verification.json
            tests/load/.runs/*/environment.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove test sessions and private logs
        if: always()
        run: |
          for fixture in tests/load/.runs/*/fixtures.json; do
            [ -f "$fixture" ] || continue
            run_id=$(basename "$(dirname "$fixture")")
            tests/load/.venv/bin/python tests/load/lab.py cleanup --run-id "$run_id"
          done
