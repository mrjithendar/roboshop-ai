name: RobotShop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-only
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shipping_test
          POSTGRES_USER: shipping
          POSTGRES_PASSWORD: ci-local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shipping -d shipping_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SHIPPING_DATABASE_URL: postgresql://shipping:ci-local-only@127.0.0.1:5432/shipping_test
      SHIPPING_DB_TLS: "false"
      SHIPPING_DB_PASSWORD: ci-local-only
      SHIPPING_APP_PASSWORD: ci-runtime-only
      CACHE_ENABLED: "true"
      MESSAGING_ENABLED: "true"
      REDIS_PASSWORD: ""
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_USERNAME: ci
      RABBITMQ_PASSWORD: ci-only
      RABBITMQ_URL: amqp://ci:ci-only@127.0.0.1:5672
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run frontend:typecheck
      - run: npm run shipping:build
      - run: npm run shipping:migrate
      - run: docker build -f services/nginx/Dockerfile --tag robotshop-nginx:ci .
      - run: npm test
        env:
          NGINX_TEST: "true"
          NGINX_TEST_IMAGE: robotshop-nginx:ci
      - run: npm run evaluate
      - run: REDIS_PASSWORD=ci-config-only docker compose config --format json | node scripts/check-compose.mjs
      - run: docker build --tag robotshop-ai:ci .
      - run: docker build -f services/shipping-service/Dockerfile --tag robotshop-shipping:ci .
