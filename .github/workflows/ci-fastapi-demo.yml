name: FastAPI demo image
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/fastapi-demo/**'
      - '.github/workflows/ci-fastapi-demo.yml'
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test with Python 3.14 in Docker
        run: docker build --progress=plain --target test -f services/fastapi-demo/Dockerfile services/fastapi-demo
  publish:
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-ecr.yml
    with:
      service: fastapi-demo
