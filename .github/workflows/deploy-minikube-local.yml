name: Deploy-Minikube

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Local Minikube profile (installer replacement profiles are resolved automatically)
        required: true
        default: mk4
        type: string

permissions:
  contents: read

# All runs share the host Docker tags and target namespace. Never interrupt a rollout.
concurrency:
  group: robotshop-minikube-local
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      PROFILE: ${{ inputs.profile }}
      IMAGE_PREFIX: robotshop
      PUBLIC_ORIGIN: https://jithendar.com
      # Optional absolute path on the runner. Defaults to its normal kubeconfig.
      RUNNER_KUBECONFIG: ${{ vars.MINIKUBE_KUBECONFIG }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check local tools and cluster before building
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          for tool in docker minikube kubectl python3 openssl; do
            command -v "$tool" >/dev/null || { echo "Missing runner tool: $tool" >&2; exit 1; }
          done
          python3 -c 'import yaml' || { echo 'Install PyYAML for the runner python3 before running this workflow.' >&2; exit 1; }
          [[ "$PROFILE" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]] || { echo 'Invalid profile.' >&2; exit 1; }
          state="${MINIKUBE_HOME:-$HOME/.minikube}/robotshop-installer/$PROFILE.profile"
          if [[ -f "$state" ]]; then PROFILE="$(cat "$state")"; fi
          [[ "$PROFILE" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]] || { echo 'Invalid saved profile.' >&2; exit 1; }
          export KUBECONFIG="${RUNNER_KUBECONFIG:-$HOME/.kube/config}"
          [[ "$KUBECONFIG" == /* && "$KUBECONFIG" != *$'\n'* && -f "$KUBECONFIG" ]] || { echo 'Kubeconfig must be an existing absolute file path on this runner.' >&2; exit 1; }
          docker info >/dev/null
          minikube -p "$PROFILE" status
          kubectl --context="$PROFILE" --request-timeout=15s get namespace kube-system >/dev/null
          kubectl --context="$PROFILE" --request-timeout=15s get ingressclass traefik >/dev/null
          kubectl --context="$PROFILE" --request-timeout=15s get crd middlewares.traefik.io >/dev/null
          kubectl --context="$PROFILE" wait --for=condition=Ready clusterissuer/letsencrypt-prod --timeout=60s
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "KUBE_CONTEXT=$PROFILE" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"

      - name: Deploy infrastructure dependencies
        run: bash deploy-minikube.sh --infrastructure

      - name: Build and deploy smtp-server
        run: |
          bash build-images.sh --service smtp-server --local
          bash minikube/deploy-smtp.sh

      - name: Build and deploy product-ingestion
        run: |
          bash build-images.sh --service product-ingestion --local
          bash deploy-minikube.sh --service product-ingestion --load-images

      - name: Build and deploy catalogue-service
        run: |
          bash build-images.sh --service catalogue-service --local
          bash deploy-minikube.sh --service catalogue-service --load-images

      - name: Build and deploy recommendation-service
        run: |
          bash build-images.sh --service recommendation-service --local
          bash deploy-minikube.sh --service recommendation-service --load-images

      - name: Build and deploy shopping-agent
        run: |
          bash build-images.sh --service shopping-agent --local
          bash deploy-minikube.sh --service shopping-agent --load-images

      - name: Build and deploy sre-copilot
        run: |
          bash build-images.sh --service sre-copilot --local
          bash deploy-minikube.sh --service sre-copilot --load-images

      - name: Build and deploy cart-service
        run: |
          bash build-images.sh --service cart-service --local
          bash deploy-minikube.sh --service cart-service --load-images

      - name: Build and deploy payment-service
        run: |
          bash build-images.sh --service payment-service --local
          bash deploy-minikube.sh --service payment-service --load-images

      - name: Build and deploy shipping-service
        run: |
          bash build-images.sh --service shipping-service --local
          bash deploy-minikube.sh --service shipping-service --load-images

      - name: Build and deploy ai-gateway
        run: |
          bash build-images.sh --service ai-gateway --local
          bash deploy-minikube.sh --service ai-gateway --load-images

      - name: Build and deploy frontend
        run: |
          bash build-images.sh --service frontend --local
          bash deploy-minikube.sh --service frontend --load-images

      - name: Build and deploy nginx
        run: |
          bash build-images.sh --service nginx --local
          bash deploy-minikube.sh --service nginx --load-images

      - name: Build and deploy mcp-server
        run: |
          bash build-images.sh --service mcp-server --local
          bash deploy-minikube.sh --service mcp-server --load-images

      - name: Build and deploy finder
        run: |
          bash build-images.sh --service finder --local
          bash deploy-minikube.sh --service finder --load-images

      - name: Publish catalogue and configure ingress TLS
        run: bash deploy-minikube.sh --finalize

      - name: Record deployment
        if: success()
        run: |
          {
            echo '### Local-image deployment completed'
            echo "Commit: $GITHUB_SHA"
            echo "Minikube profile: $PROFILE"
            echo 'Image tags: robotshop-*:local'
            echo 'Application: https://jithendar.com/roboshop/'
            echo 'SMTP: deployed with DKIM and cert-manager client certificates before ai-gateway.'
            echo 'Publish the DKIM TXT record from the SMTP step; mail delivery requires mail DNS/PTR and outbound TCP 25.'
            echo 'Check deployment logs for optional Finder readiness warnings.'
          } >> "$GITHUB_STEP_SUMMARY"
