name: Argo CD catalog checks
on:
  pull_request:
    paths: ['argocd/**', 'minikube/**', 'services/**/*-minikube.yaml', 'scripts/argocd*', 'scripts/argocd/**', 'tests/test_argocd_catalog.py', '.github/workflows/argocd-checks.yml']
  push:
    branches: [master]
    paths: ['argocd/**', 'minikube/**', 'services/**/*-minikube.yaml', 'scripts/argocd*', 'scripts/argocd/**', 'tests/test_argocd_catalog.py', '.github/workflows/argocd-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.14'}
      - uses: azure/setup-kubectl@v4
        with: {version: v1.35.0}
      - uses: azure/setup-helm@v4.3.1
      - run: python -m pip install PyYAML pytest
      - run: python scripts/argocd/validate.py --external-charts
      - run: python -m pytest -q tests/test_argocd_catalog.py tests/test_openclaw_manifests.py tests/test_openclaw_scripts.py minikube/test-wordpress.py minikube/test-jfrog.py
