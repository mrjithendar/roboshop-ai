name: Langfuse subpath image
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ci-langfuse.yml'
      - 'minikube/langfuse/Dockerfile'
      - 'minikube/langfuse/LICENSE.langfuse'
permissions:
  contents: read
concurrency:
  group: langfuse-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 180
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout RoboShop Dockerfile
        uses: actions/checkout@v7
        with:
          path: roboshop
          persist-credentials: false
      - name: Checkout pinned upstream release
        uses: actions/checkout@v7
        with:
          repository: langfuse/langfuse
          ref: v4.63.0
          path: langfuse-source
          persist-credentials: false
      - name: Isolate Docker credentials and ensure repository
        shell: bash
        run: |
          set -euo pipefail
          echo "DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/langfuse-docker.XXXXXX")" >> "$GITHUB_ENV"
          repos=$(aws ecr describe-repositories --query 'repositories[].repositoryName' --output text)
          if ! tr '\t' '\n' <<< "$repos" | grep -qx roboshop-langfuse; then
            aws ecr create-repository --repository-name roboshop-langfuse --image-scanning-configuration scanOnPush=true >/dev/null
          fi
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      # Native ARM64 avoids QEMU failures in UBI RPM installroot scriptlets.
      - name: Verify ARM64 Docker engine
        shell: bash
        run: |
          set -euo pipefail
          case "$(docker info --format '{{.Architecture}}')" in
            arm64|aarch64) ;;
            *) echo 'ARM64 Docker engine required.' >&2; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          # Bound this build on the server shared with Minikube. Serial stages
          # avoid compiling Go, installing RPMs and bundling Next.js together.
          driver: docker-container
          driver-opts: |
            memory=8g
            memory-swap=8g
            cpu-period=100000
            cpu-quota=200000
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - name: Build web image with compiled subpath
        uses: docker/build-push-action@v7
        with:
          context: ./langfuse-source
          file: ./roboshop/minikube/langfuse/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/arm64
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/langfuse
            BUILD_NODE_HEAP_MB=4096
            BUILD_TASK_CONCURRENCY=1
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/roboshop-langfuse:4.63.0-subpath
          cache-from: type=gha,scope=langfuse-subpath-${{ runner.arch }}
          cache-to: type=gha,scope=langfuse-subpath-${{ runner.arch }},mode=max
      - name: Remove temporary Docker credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" && "$DOCKER_CONFIG" == "$RUNNER_TEMP"/langfuse-docker.* ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
