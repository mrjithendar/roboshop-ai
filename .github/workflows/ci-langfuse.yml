name: Langfuse subpath image
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ci-langfuse.yml'
      - 'minikube/langfuse/Dockerfile'
      - 'minikube/langfuse/LICENSE.langfuse'
permissions:
  contents: read
concurrency:
  group: langfuse-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: self-hosted
    timeout-minutes: 90
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout RoboShop Dockerfile
        uses: actions/checkout@v7
        with:
          path: roboshop
          persist-credentials: false
      - name: Checkout pinned upstream release
        uses: actions/checkout@v7
        with:
          repository: langfuse/langfuse
          ref: v4.63.0
          path: langfuse-source
          persist-credentials: false
      - name: Isolate Docker credentials and ensure repository
        shell: bash
        run: |
          set -euo pipefail
          echo "DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/langfuse-docker.XXXXXX")" >> "$GITHUB_ENV"
          repos=$(aws ecr describe-repositories --query 'repositories[].repositoryName' --output text)
          if ! tr '\t' '\n' <<< "$repos" | grep -qx roboshop-langfuse; then
            aws ecr create-repository --repository-name roboshop-langfuse --image-scanning-configuration scanOnPush=true >/dev/null
          fi
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      # UBI RPM installroot scriptlets must execute natively. Emulated
      # chroot execution fails on this runner while installing glibc/CA certs.
      - name: Select native Linux image platform
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux ]] || { echo 'A Linux build runner is required.' >&2; exit 1; }
          case "$(uname -m)" in
            aarch64|arm64) platform=linux/arm64 ;;
            x86_64|amd64) platform=linux/amd64 ;;
            *) echo 'Unsupported runner CPU architecture.' >&2; exit 1 ;;
          esac
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "Building native image: $platform (single architecture)"
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - name: Build web image with compiled subpath
        uses: docker/build-push-action@v7
        with:
          context: ./langfuse-source
          file: ./roboshop/minikube/langfuse/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: ${{ steps.platform.outputs.platform }}
          build-args: NEXT_PUBLIC_BASE_PATH=/langfuse
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/roboshop-langfuse:4.63.0-subpath
          cache-from: type=gha,scope=langfuse-subpath-${{ runner.arch }}
          cache-to: type=gha,scope=langfuse-subpath-${{ runner.arch }},mode=max
      - name: Remove temporary Docker credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" && "$DOCKER_CONFIG" == "$RUNNER_TEMP"/langfuse-docker.* ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
