name: OpenClaw operations checks
on:
  pull_request:
    paths: ['services/mcp-server/**', 'services/ai-gateway/**', 'minikube/openclaw/**', 'minikube/monitoring/prometheus/**', 'scripts/openclaw*', 'scripts/openclaw/**', 'tests/test_openclaw_manifests.py', '.github/workflows/openclaw-checks.yml']
  push:
    branches: [master]
    paths: ['services/mcp-server/**', 'services/ai-gateway/**', 'minikube/openclaw/**', 'minikube/monitoring/prometheus/**', 'scripts/openclaw/**', 'tests/test_openclaw_manifests.py', 'tests/test_openclaw_scripts.py', '.github/workflows/openclaw-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@v7
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v7
        with: {node-version: '26.12.1'}
      - uses: azure/setup-kubectl@v4
        with: {version: v1.35.0}
      - uses: azure/setup-helm@v4.3.1
      # Operations and shop services are separate deployments with independent pins.
      - name: Install OpenClaw test dependencies
        run: |
          python -m pip install -r services/mcp-server/operations/requirements.txt pytest PyYAML
          python -m pip check
      - name: Install shop regression dependencies in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/openclaw-regression"
          "$RUNNER_TEMP/openclaw-regression/bin/python" -m pip install -r services/mcp-server/requirements.txt -r services/ai-gateway/requirements.txt -r services/user-service/requirements.txt -r services/moks/requirements.txt -r services/cart-service/requirements.txt -r tests/python/requirements.txt
          "$RUNNER_TEMP/openclaw-regression/bin/python" -m pip check
      - run: npm ci --prefix services/mcp-server/operations/plugins --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm install --global openclaw@2026.10.7
      - run: python scripts/openclaw/validate_config.py
      - run: python -m pytest -q services/mcp-server/tests/operations tests/test_openclaw_manifests.py tests/test_openclaw_scripts.py
      - run: python scripts/openclaw/local_smoke.py
      - run: '"$RUNNER_TEMP/openclaw-regression/bin/python" -m unittest discover -s services/mcp-server/tests -v'
      - run: '"$RUNNER_TEMP/openclaw-regression/bin/python" -m unittest discover -s services/ai-gateway/tests -v'
      - run: '"$RUNNER_TEMP/openclaw-regression/bin/python" -m unittest discover -s tests/python -v'
      - run: helm template prometheus minikube/monitoring/prometheus -n monitoring -f minikube/openclaw/monitoring/prometheus-values.yaml > /tmp/prometheus.yaml
      - name: Validate image build (never publish from a PR)
        run: docker build -f services/mcp-server/Dockerfile.operations -t openclaw-operations:test services/mcp-server
