name: ai-gateway image

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'services/ai-gateway/**'
      - '.github/workflows/ci-ai-gateway.yml'
      - '.github/workflows/publish-ecr.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-ecr.yml
    with:
      service: ai-gateway
