name: ai-gateway image

on:
  workflow_dispatch:
  push:
    # branches: [master, main]
    paths:
      - 'services/ai-gateway/**'
      - '.github/workflows/ci-ai-gateway.yml'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-image.yml
    secrets: inherit
    with:
      service: ai-gateway
