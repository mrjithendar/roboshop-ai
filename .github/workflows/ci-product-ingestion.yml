name: product-ingestion image

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'services/product-ingestion/**'
      - '.github/workflows/ci-product-ingestion.yml'
      - '.github/workflows/publish-ecr.yml'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/publish-ecr.yml
    with:
      service: product-ingestion
