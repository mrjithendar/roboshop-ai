# Maintain active manifests using explicit paths; archived legacy/ and reference-only sources are excluded.
version: 2
updates:
- package-ecosystem: npm
  directories:
  - /
  - /services/web/frontend
  - /services/catalogue-service
  - /services/payment-service
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 5
  groups:
    node-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore(deps)
- package-ecosystem: docker
  directories:
  - /services/ai-gateway
  - /services/cart-service
  - /services/catalogue-service
  - /services/currency-service
  - /services/kafka-bridge
  - /services/mcp-server
  - /services/moks
  - /services/web
  - /services/payment-service
  - /services/shipping-service
  - /services/user-service
  - /tests/load
  # Data stores synced by argocd-minikube (stateful: merging restarts the pod; mk4 hostpath PVs have no
  # nodeAffinity, so check the node before merging)
  - /services/postgres
  - /services/rabbitmq
  - /services/redis
  - /argocd-eks/apps/data
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 5
  groups:
    runtime-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  # Python minors change the wheel ABI and must move with setup-python in the CI workflows (3.14); bump by hand.
  - dependency-name: python
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  # Major PostgreSQL upgrades need pg_upgrade or a dump/restore of the data volume.
  - dependency-name: postgres
    update-types:
    - version-update:semver-major
  # MongoDB feature versions upgrade one step at a time and change the on-disk format.
  - dependency-name: mongo
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  - dependency-name: redis
    update-types:
    - version-update:semver-major
  # RabbitMQ needs every feature flag enabled before a major upgrade.
  - dependency-name: rabbitmq
    update-types:
    - version-update:semver-major
  commit-message:
    prefix: chore(deps)
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 5
  groups:
    actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore(ci)
- package-ecosystem: gradle
  directory: /services/shipping-service
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  groups:
    java-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore(deps)
  open-pull-requests-limit: 5
- package-ecosystem: pip
  directories:
  - /services/ai-gateway
  - /services/cart-service
  - /services/catalogue-service
  - /services/kafka-bridge
  - /services/mcp-server
  - /services/moks
  - /services/user-service
  - /services/user-service/tests
  - /tests/load
  - /tests/python
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  groups:
    python-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
- package-ecosystem: gomod
  directory: /services/currency-service
  groups:
    go-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
