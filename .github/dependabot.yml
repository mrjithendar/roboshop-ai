# Maintain the active platform. legacy/ is an unchanged upstream reference;
# docker-compose.legacy.yml is the matching legacy launch configuration.
# Add new ecosystems only when their manifests exist in the active project.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - legacy/**
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      node-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directories:
      - /services/ai-gateway
      - /services/product-ingestion
      - /services/catalogue-service
      - /services/recommendation-service
      - /services/shopping-agent
      - /services/cart-service
      - /services/sre-copilot
      - /services/payment-service
      - /services/mcp-server
    exclude-paths:
      - legacy/**
      - docker-compose.legacy.yml
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      runtime-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker-compose
    directories:
      - /
      - /services/redis
      - /services/rabbitmq
      - /services/mongodb
      - /services/postgres
      - /services/nginx
    exclude-paths:
      - legacy/**
      - docker-compose.legacy.yml
    # This image is built locally, not resolved from a public registry.
    ignore:
      - dependency-name: robotshop-nginx
      - dependency-name: robotshop-shipping
      - dependency-name: robotshop-ai-gateway
      - dependency-name: robotshop-product-ingestion
      - dependency-name: robotshop-recommendation-service
      - dependency-name: robotshop-shopping-agent
      - dependency-name: robotshop-sre-copilot
      - dependency-name: robotshop-payment-service
      - dependency-name: robotshop-mcp-server
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      observability-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: terraform
    # Current working-tree location; update this if VPC sources move again.
    directory: /vpc
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gradle
    directory: /services/shipping-service
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    groups:
      java-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /services/shipping-service
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /services/nginx
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directories:
      - /services/ai-gateway
      - /services/shopping-agent
      - /services/cart-service
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
