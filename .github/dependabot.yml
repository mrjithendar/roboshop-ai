# Maintain active manifests using explicit paths; archived legacy/ and reference-only sources are excluded.
version: 2
updates:
- package-ecosystem: npm
  directories:
  - /
  - /services/web/frontend
  - /services/catalogue-service
  - /services/payment-service
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 5
  groups:
    node-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore(deps)
- package-ecosystem: docker
  directories:
  - /services/ai-gateway
  - /services/cart-service
  - /services/catalogue-service
  - /services/currency-service
  - /services/kafka-bridge
  - /services/mcp-server
  - /services/moks
  - /services/web
  - /services/payment-service
  - /services/shipping-service
  - /services/user-service
  - /tests/load
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 5
  groups:
    runtime-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore(deps)
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 5
  groups:
    actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore(ci)
- package-ecosystem: gradle
  directory: /services/shipping-service
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  groups:
    java-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: chore(deps)
  open-pull-requests-limit: 5
- package-ecosystem: pip
  directories:
  - /services/ai-gateway
  - /services/cart-service
  - /services/catalogue-service
  - /services/kafka-bridge
  - /services/mcp-server
  - /services/moks
  - /services/user-service
  - /services/user-service/tests
  - /tests/load
  - /tests/python
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  groups:
    python-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
- package-ecosystem: gomod
  directory: /services/currency-service
  groups:
    go-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
