# Maintain the active platform. legacy/ is an unchanged upstream reference;
# docker-compose.legacy.yml is the matching legacy launch configuration.
# Add new ecosystems only when their manifests exist in the active project.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - legacy/**
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      node-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /
    exclude-paths:
      - legacy/**
      - docker-compose.legacy.yml
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      runtime-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker-compose
    directory: /
    exclude-paths:
      - legacy/**
      - docker-compose.legacy.yml
    # This image is built locally, not resolved from a public registry.
    ignore:
      - dependency-name: robotshop-shipping
      - dependency-name: robotshop-ai
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      observability-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: terraform
    # Current working-tree location; update this if VPC sources move again.
    directory: /vpc
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gradle
    directory: /services/shipping-service
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    groups:
      java-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /services/shipping-service
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    commit-message:
      prefix: "chore(deps)"
