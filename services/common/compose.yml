# Reusable environment definitions, inherited by service compose files.
# These templates are not runnable services in the root project.
services:
  telemetry:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.2.0}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
  application:
    extends:
      service: telemetry
    environment:
      INGESTION_URL: http://product-ingestion:4101
      RECOMMENDATION_URL: http://recommendation-service:4102
      AGENT_URL: http://shopping-agent:4103
      SRE_URL: http://sre-copilot:4104
      PAYMENT_URL: http://payment-service:4105
