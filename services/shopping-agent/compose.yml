# Extended by root docker-compose.yml; run Compose from the repository root.
services:
  shopping-agent:
    extends:
      file: ../common/compose.yml
      service: application
    image: ${IMAGE_PREFIX:-robotshop}-shopping-agent:local
    environment:
      LLM_SERVICE_TOKEN: ${LLM_SERVICE_TOKEN:-}
      OLLAMA_ENDPOINTS_JSON: ${OLLAMA_ENDPOINTS_JSON:-{}}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4103/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      product-ingestion:
        condition: service_healthy
