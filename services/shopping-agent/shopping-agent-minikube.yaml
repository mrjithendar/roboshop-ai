# Minikube sandbox deployment; apply with ./deploy-minikube.sh.
apiVersion: v1
kind: Service
metadata:
  name: shopping-agent
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  selector:
    app: shopping-agent
  ports:
  - name: p4103
    port: 4103
    targetPort: 4103
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-agent
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-agent
  template:
    metadata:
      labels:
        app: shopping-agent
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ecr-pull
      containers:
      - name: shopping-agent
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/roboshop-shopping-agent:latest
        imagePullPolicy: Always
        env:
        - name: LLM_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: LLM_SERVICE_TOKEN
        - name: LANGFUSE_BASE_URL
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: LANGFUSE_BASE_URL
              optional: true
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: LANGFUSE_PUBLIC_KEY
              optional: true
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: LANGFUSE_SECRET_KEY
              optional: true
        - name: AI_GATEWAY_URL
          value: http://ai-gateway:3000
        - name: OLLAMA_ENDPOINTS_JSON
          value: '{}'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 4103
        envFrom:
        - configMapRef:
            name: roboshop-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet: &id001
            path: /health
            port: 4103
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          httpGet: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 4103
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    type: Recreate
