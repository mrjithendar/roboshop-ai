apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping-service
  template:
    metadata:
      labels:
        app: shipping-service
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ecr-pull
      containers:
      - name: shipping-service
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/roboshop-shipping:latest
        imagePullPolicy: Always
        env:
        - name: SHIPPING_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: SHIPPING_APP_PASSWORD
        - name: SHIPPING_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: SHIPPING_DB_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: REDIS_PASSWORD
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: RABBITMQ_PASSWORD
        - name: SHIPPING_DATABASE_URL
          value: postgresql://shipping_app:$(SHIPPING_APP_PASSWORD)@shipping-db:5432/shipping
        - name: SHIPPING_MIGRATION_DATABASE_URL
          value: postgresql://shipping:$(SHIPPING_DB_PASSWORD)@shipping-db:5432/shipping
        - name: SHIPPING_DB_TLS
          value: 'false'
        - name: SHIPPING_TRACING_ENABLED
          value: 'true'
        - name: CACHE_ENABLED
          value: 'true'
        - name: REDIS_PORT
          value: '6379'
        - name: RABBITMQ_PORT
          value: '5672'
        - name: REDIS_HOST
          value: redis
        - name: MESSAGING_ENABLED
          value: 'true'
        - name: RABBITMQ_HOST
          value: rabbitmq
        - name: RABBITMQ_USERNAME
          value: roboshop
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
        ports:
        - containerPort: 4106
        envFrom:
        - configMapRef:
            name: roboshop-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet: &id001
            path: /health
            port: 4106
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          httpGet: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/shipping/ready
            port: 4106
          timeoutSeconds: 3
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    type: Recreate
