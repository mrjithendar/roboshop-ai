# Minikube sandbox deployment; apply with ./scripts/deploy/deploy-minikube.sh.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  selector:
    app: jaeger
  ports:
  - name: p16686
    port: 16686
    targetPort: 16686
  - name: p4318
    port: 4318
    targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: jaeger
        image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
        imagePullPolicy: IfNotPresent
        env: []
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 16686
        - containerPort: 4318
        startupProbe:
          tcpSocket: &id001
            port: 16686
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          tcpSocket: *id001
          timeoutSeconds: 3
  strategy:
    type: Recreate
