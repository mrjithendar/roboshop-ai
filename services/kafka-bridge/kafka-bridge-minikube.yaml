apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: roboshop-ai
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
  - name: kafka
    port: 9092
  - name: controller
    port: 9093
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: roboshop-ai
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: prepare-data
        image: apache/kafka:4.1.2
        command:
        - sh
        - -ec
        - mkdir -p /data/logs && chown 1000:1000 /data /data/logs
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: kafka
        image: apache/kafka:4.1.2
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 9092
        - containerPort: 9093
        env:
        - name: CLUSTER_ID
          value: 4L6g3nShT-eMCtK--X86sw
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka-0.kafka.roboshop-ai.svc.cluster.local:9092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka-0.kafka.roboshop-ai.svc.cluster.local:9093
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data/logs
        - name: KAFKA_LOG_RETENTION_HOURS
          value: '168'
        - name: KAFKA_LOG_SEGMENT_BYTES
          value: '67108864'
        - name: KAFKA_HEAP_OPTS
          value: -Xms256m -Xmx512m
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        startupProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 10
      - name: kafka-bridge
        envFrom:
        - configMapRef:
            name: roboshop-config
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/roboshop-kafka-bridge:latest
        imagePullPolicy: Always
        env:
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_URL
          value: amqp://roboshop:$(RABBITMQ_PASSWORD)@rabbitmq:5672
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: roboshop-config
              key: LOG_FORMAT
              optional: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 4113
        livenessProbe:
          httpGet:
            path: /health
            port: 4113
          periodSeconds: 20
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 4113
          periodSeconds: 10
          timeoutSeconds: 3
      imagePullSecrets:
      - name: ecr-pull
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-internal
  namespace: roboshop-ai
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kafka-bridge
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - port: 9092
    - port: 9093
