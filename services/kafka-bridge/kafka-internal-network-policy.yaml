apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-internal
  namespace: roboshop-ai
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kafka-bridge
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - port: 9092
    - port: 9093
