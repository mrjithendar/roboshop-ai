# Internal AMQP and loopback-published management UI for local Compose.
# Production uses a managed TLS broker via the Helm integration Secret.
listeners.tcp.default = 5672
management.tcp.port = 15672
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB
# Exchanges, quorum queues and DLQ bindings are declared by the applications.
