# Service definition consumed by the root docker-compose.yml via extends.
# Run Compose from the repository root; paths here are relative to this directory.
services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: robotshop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-robotshop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 12
