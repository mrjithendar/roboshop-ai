# Minikube sandbox deployment; apply with ./deploy-minikube.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
data:
  rabbitmq.conf: '# Internal AMQP and management UI; use a private port-forward for management.

    # Production uses a managed TLS broker via the Helm integration Secret.

    listeners.tcp.default = 5672

    management.tcp.port = 15672

    vm_memory_high_watermark.relative = 0.6

    disk_free_limit.absolute = 1GB

    # Exchanges, quorum queues and DLQ bindings are declared by the applications.

    '
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  selector:
    app: rabbitmq
  ports:
  - name: p5672
    port: 5672
    targetPort: 5672
  - name: p15672
    port: 15672
    targetPort: 15672
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        app.kubernetes.io/part-of: robotshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: rabbitmq
        image: rabbitmq:4.1-management-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: robotshop
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_NODENAME
          value: rabbit@rabbitmq-0
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - containerPort: 5672
        - containerPort: 15672
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        - name: config
          mountPath: /etc/rabbitmq/rabbitmq.conf
          subPath: rabbitmq.conf
          readOnly: true
        startupProbe:
          tcpSocket: &id001
            port: 5672
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rabbitmq-data
      - name: config
        configMap:
          name: rabbitmq-config
          defaultMode: 365
  serviceName: rabbitmq
