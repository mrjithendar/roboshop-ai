apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      # Minikube hostPath data lives on this node; move only together with the data.
      nodeSelector:
        kubernetes.io/hostname: mk4-m03
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: rabbitmq
        image: rabbitmq:4.1-management-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: roboshop
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_NODENAME
          value: rabbit@rabbitmq-0
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - containerPort: 5672
        - containerPort: 15672
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        - name: config
          mountPath: /etc/rabbitmq/rabbitmq.conf
          subPath: rabbitmq.conf
          readOnly: true
        startupProbe:
          tcpSocket: &id001
            port: 5672
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          timeoutSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rabbitmq-data
      - name: config
        configMap:
          name: roboshop-config
          items:
          - key: rabbitmq.conf
            path: rabbitmq.conf
          defaultMode: 365
  serviceName: rabbitmq
