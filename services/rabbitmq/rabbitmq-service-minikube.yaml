apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  selector:
    app: rabbitmq
  ports:
  - name: p5672
    port: 5672
    targetPort: 5672
  - name: p15672
    port: 15672
    targetPort: 15672
  clusterIP: None
