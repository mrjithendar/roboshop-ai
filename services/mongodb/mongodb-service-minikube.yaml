apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop-ai
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  selector:
    app: mongodb
  ports:
  - name: p27017
    port: 27017
    targetPort: 27017
