apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: roboshop-ai
spec:
  selector:
    app: user-service
  ports:
  - name: http
    port: 4109
    targetPort: 4109
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: roboshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      imagePullSecrets:
      - name: ecr-pull
      containers:
      - name: user-service
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/roboshop-user-service:latest
        imagePullPolicy: Always
        env:
        - name: SUPERADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: SUPERADMIN_EMAIL
        - name: SUPERADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: SUPERADMIN_PASSWORD
        - name: AUTH_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: AUTH_ENCRYPTION_KEY
              optional: true
        - name: SMTP_HOST
          value: email-smtp.us-east-1.amazonaws.com
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_FROM
          value: no-reply@jithendar.com
        - name: SMTP_SECURITY
          value: starttls
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: SMTP_USERNAME
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: SMTP_PASSWORD
              optional: true
        - name: TURNSTILE_SITE_KEY
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: TURNSTILE_SITE_KEY
              optional: true
        - name: TURNSTILE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: TURNSTILE_SECRET_KEY
              optional: true
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: MONGO_APP_PASSWORD
        - name: MONGODB_URL
          value: mongodb://roboshop:$(MONGO_APP_PASSWORD)@mongodb:27017/roboshop?authSource=roboshop
        - name: USER_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: USER_SERVICE_TOKEN
        - name: TRUST_PROXY
          value: 'false'
        envFrom:
        - configMapRef:
            name: roboshop-config
        ports:
        - containerPort: 4109
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /api/users/ready
            port: 4109
          timeoutSeconds: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 4109
        startupProbe:
          httpGet:
            path: /health
            port: 4109
          timeoutSeconds: 6
          periodSeconds: 5
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir: {}
