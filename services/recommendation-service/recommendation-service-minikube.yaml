# Minikube sandbox deployment; apply with ./deploy-minikube.sh.
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  selector:
    app: recommendation-service
  ports:
  - name: p4102
    port: 4102
    targetPort: 4102
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ecr-pull
      containers:
      - name: recommendation-service
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/roboshop-recommendation-service:latest
        imagePullPolicy: Always
        env: []
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 4102
        envFrom:
        - configMapRef:
            name: roboshop-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet: &id001
            path: /health
            port: 4102
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          httpGet: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 4102
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    type: Recreate
