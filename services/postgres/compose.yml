# Service definition consumed by the root docker-compose.yml via extends.
# Run Compose from the repository root; paths here are relative to this directory.
services:
  shipping-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shipping
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: ${SHIPPING_DB_PASSWORD:?Set SHIPPING_DB_PASSWORD}
      SHIPPING_APP_PASSWORD: ${SHIPPING_APP_PASSWORD:?Set SHIPPING_APP_PASSWORD}
    volumes:
    # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/18/docker.
    - shipping-postgres:/var/lib/postgresql
    - ./10-shipping-role.sh:/docker-entrypoint-initdb.d/10-shipping-role.sh:ro
    ports:
    - 127.0.0.1:5432:5432
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U shipping -d shipping
      interval: 5s
      timeout: 3s
      retries: 10
