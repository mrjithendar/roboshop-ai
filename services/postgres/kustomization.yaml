apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: roboshop-ai
resources:
- shipping-postgres-pvc-minikube.yaml
- shipping-db-service-minikube.yaml
- shipping-db-deployment-minikube.yaml
- import-locations-job.yaml
configMapGenerator:
- name: shipping-location-seed
  files:
  - shipping.sql.gz
  # The seed exceeds the 256 KiB last-applied annotation used by client-side
  # apply; require server-side apply on the object, whatever the app's options.
  options:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true
