apiVersion: batch/v1
kind: Job
metadata:
  name: shipping-location-import
  namespace: roboshop-ai
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: import
        image: postgres:18-alpine
        command:
        - /bin/sh
        - -ec
        args:
        - 'set -o pipefail

          gunzip -c /seed/shipping.sql.gz | psql -X -v ON_ERROR_STOP=1 -h shipping-db
          -U shipping -d shipping

          '
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: SHIPPING_DB_PASSWORD
        - name: PGCONNECT_TIMEOUT
          value: '10'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
      volumes:
      - name: seed
        configMap:
          name: shipping-location-seed
