apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: shipping-postgres
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  storageClassName: gp3-encrypted
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
