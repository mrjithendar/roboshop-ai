# Minikube sandbox deployment; apply with ./deploy-minikube.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
        app.kubernetes.io/part-of: robotshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ecr-pull
      containers:
      - name: mcp-server
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/robotshop-mcp-server:latest
        imagePullPolicy: Always
        env:
        - name: GATEWAY_URL
          value: http://ai-gateway:3000
        - name: MCP_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: MCP_SESSION_TOKEN
              optional: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        envFrom:
        - configMapRef:
            name: robotshop-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        stdin: true
        stdinOnce: false
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    type: Recreate
