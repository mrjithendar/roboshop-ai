worker_processes auto;
pid /tmp/frontend.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_tokens off;
        root /usr/share/nginx/html;
        location = /health { return 200 'ok'; }
        location = / { limit_except GET { deny all; } try_files /index.html =404; }
        location = /admin { limit_except GET { deny all; } try_files /admin.html =404; }
        location ~ ^/(index\.html|admin\.html|app\.js|admin\.js|account\.js|styles\.css)$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ~ ^/images/[A-Za-z0-9_-]+\.png$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
