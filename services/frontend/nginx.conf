worker_processes auto;
pid /tmp/frontend.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $uri $route_group {
        default asset_or_other;
        /health health;
        / home;
        ~^/products/ product_detail;
        ~^/(cart|checkout) checkout;
        ~^/(login|register) authentication;
        ~^/account profile;
        ~^/admin admin;
    }
    map "$route_group:$status" $log_request { default 1; "health:200" 0; }
    log_format frontend escape=json '{"timestamp":"$time_iso8601","service":"frontend","event":"request_completed","requestId":"$request_id","method":"$request_method","route":"$route_group","status":$status,"durationSeconds":$request_time}';
    access_log /dev/stdout frontend if=$log_request;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_tokens off;
        root /usr/share/nginx/html;
        location = /health { return 200 'ok'; }
        location = / { limit_except GET { deny all; } try_files /index.html =404; }
        location ~ "^/products/[a-z0-9][a-z0-9-]{0,99}$" { limit_except GET { deny all; } try_files /product.html =404; }
        location ~ ^/(cart|checkout)/?$ { limit_except GET { deny all; } try_files /checkout.html =404; }
        location ~ ^/account/?$ { limit_except GET { deny all; } try_files /profile.html =404; }
        location ~ ^/(login|register)/?$ { limit_except GET { deny all; } try_files /auth.html =404; }
        location = /admin { limit_except GET { deny all; } try_files /admin.html =404; }
        location ~ ^/(auth\.(html|js)|index\.html|admin\.html|product\.html|checkout\.html|checkout\.js|profile\.html|profile\.js|paths\.js|product\.js|app\.js|admin\.js|account\.js|styles\.css)$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ~ ^/images/[A-Za-z0-9_-]+\.png$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ~ ^/illustrations/(robot|kit|component|accessory)\.svg$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ~ ^/fonts/inter-latin(-ext)?\.woff2$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location ~ ^/product-media/[a-z0-9-]+\.(?:jpg|png)$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
