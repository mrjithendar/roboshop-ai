<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product · RobotShop</title><link rel="stylesheet" href="/styles.css"><script type="module" src="/product.js"></script>  <script async src="/finder/widget.js"></script>
</head>
<body class="product-body"><a class="skip-link" href="#product-main">Skip to product</a><!-- STORE_HEADER -->
<main id="product-main" class="product-page"><p id="product-status" role="status">Loading product…</p><section id="product-content"></section><section id="related-products" aria-label="Related products"></section>
<section id="reviews-section" class="information-card reviews-panel" hidden><h2>Customer reviews</h2><div class="review-overview"><p id="rating-summary" role="status"></p><div id="rating-distribution" aria-label="Rating breakdown"></div></div><label>Filter by rating <select id="review-filter"><option value="">All ratings</option><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></label><div id="review-list"></div><button id="more-reviews" hidden>More reviews</button><h3>Your review</h3><p id="review-status" role="status">Log in to write a review.</p><form id="review-form" class="admin-form" hidden><fieldset id="review-rating" class="star-rating"><legend>Your rating</legend><div class="rating-options"><label><input type="radio" name="review-rating" value="1" aria-label="1 star" required><span aria-hidden="true">★</span></label><label><input type="radio" name="review-rating" value="2" aria-label="2 stars" required><span aria-hidden="true">★</span></label><label><input type="radio" name="review-rating" value="3" aria-label="3 stars" required><span aria-hidden="true">★</span></label><label><input type="radio" name="review-rating" value="4" aria-label="4 stars" required><span aria-hidden="true">★</span></label><label><input type="radio" name="review-rating" value="5" aria-label="5 stars" required checked><span aria-hidden="true">★</span></label></div><output id="rating-value" aria-live="polite">5 out of 5 stars</output></fieldset><label>Title<input id="review-title" minlength="3" maxlength="100" required></label><label>Review<textarea id="review-body" minlength="10" maxlength="2000" required></textarea></label><button id="review-save">Publish review</button><button type="button" id="review-delete" hidden>Delete my review</button></form></section><section id="demo-reviews-section" class="information-card reviews-panel" hidden><h2>Demo reviews</h2><p>Generated test reviews, not customer experiences. These do not contribute to customer ratings.</p><div id="demo-review-list"></div><button id="more-demo-reviews" hidden>More demo reviews</button></section></main>
<!-- STORE_FOOTER -->

</body></html>
