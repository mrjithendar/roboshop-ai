apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  selector:
    app: catalogue-service
  ports:
  - name: p4108
    port: 4108
    targetPort: 4108
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-service
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue-service
  template:
    metadata:
      labels:
        app: catalogue-service
        app.kubernetes.io/part-of: robotshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ecr-pull
      containers:
      - name: catalogue-service
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/robotshop-catalogue-service:latest
        imagePullPolicy: Always
        env:
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: MONGO_APP_PASSWORD
        - name: MONGODB_URL
          value: mongodb://robotshop:$(MONGO_APP_PASSWORD)@mongodb:27017/robotshop?authSource=robotshop
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 4108
        envFrom:
        - configMapRef:
            name: robotshop-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet: &id001
            path: /health
            port: 4108
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          httpGet: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/catalogue/ready
            port: 4108
          timeoutSeconds: 3
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    type: Recreate
