apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  selector:
    app: redis
  ports:
  - name: p6379
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: robotshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: redis
        image: redis:8.10-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 192Mi
        ports:
        - containerPort: 6379
        command:
        - sh
        - -ec
        - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"
        volumeMounts:
        - name: config
          mountPath: /usr/local/etc/redis
          readOnly: true
        startupProbe:
          tcpSocket: &id001
            port: 6379
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          tcpSocket: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: robotshop-config
          items:
          - key: redis.conf
            path: redis.conf
          defaultMode: 365
  strategy:
    type: Recreate
