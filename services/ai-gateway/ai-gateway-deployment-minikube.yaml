apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: roboshop-ai
  labels:
    app.kubernetes.io/part-of: roboshop-ai
spec:
  # The JSON order ledger permits exactly one writer, including during upgrades.
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
        app.kubernetes.io/part-of: roboshop-ai
    spec:
      securityContext:
        fsGroup: 1000
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ecr-pull
      containers:
      - name: ai-gateway
        image: 881026659929.dkr.ecr.us-east-1.amazonaws.com/roboshop-ai-gateway:latest
        imagePullPolicy: Always
        env:
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: MONGO_APP_PASSWORD
        - name: MONGODB_URL
          value: mongodb://roboshop:$(MONGO_APP_PASSWORD)@mongodb:27017/roboshop?authSource=roboshop
        - name: LLM_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: LLM_SERVICE_TOKEN
        - name: OLLAMA_ENDPOINTS_JSON
          value: '{}'
        - name: PAYMENT_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: PAYMENT_SERVICE_TOKEN
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_URL
          value: amqp://roboshop:$(RABBITMQ_PASSWORD)@rabbitmq:5672
        - name: TRUST_PROXY
          value: 'true'
        - name: DATA_DIR
          value: /app/.data
        - name: DEMO_MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: DEMO_MONGODB_URL
              optional: true
        - name: DEMO_REVIEWS_DATABASE
          value: roboshop_demo_merchant20
        - name: CART_URL
          value: http://cart-service:4107
        - name: CART_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: PAYMENT_SERVICE_TOKEN
        - name: USER_URL
          value: http://user-service:4109
        - name: USER_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: roboshop-secrets
              key: USER_SERVICE_TOKEN
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: roboshop-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /app/.data
        startupProbe:
          httpGet: &id001
            path: /health/live
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          httpGet: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          timeoutSeconds: 3
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: gateway-data
      initContainers:
      - name: data-permissions
        image: busybox:1.38.0
        command:
        - sh
        - -ec
        - chown -R 1000:1000 /data && chmod -R u+rwX /data
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
  strategy:
    type: Recreate
