apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-data
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  selector:
    app: ai-gateway
  ports:
  - name: p3000
    port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
        app.kubernetes.io/part-of: robotshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: ai-gateway
        image: robotshop-ai-gateway:local
        imagePullPolicy: IfNotPresent
        env:
        - name: TURNSTILE_SITE_KEY
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: TURNSTILE_SITE_KEY
              optional: true
        - name: TURNSTILE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: TURNSTILE_SECRET_KEY
              optional: true
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: MONGO_APP_PASSWORD
        - name: MONGODB_URL
          value: mongodb://robotshop:$(MONGO_APP_PASSWORD)@mongodb:27017/robotshop?authSource=robotshop
        - name: LLM_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: LLM_SERVICE_TOKEN
        - name: OLLAMA_ENDPOINTS_JSON
          value: '{}'
        - name: PAYMENT_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: PAYMENT_SERVICE_TOKEN
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_URL
          value: amqp://robotshop:$(RABBITMQ_PASSWORD)@rabbitmq:5672
        - name: TRUST_PROXY
          value: 'true'
        - name: DATA_DIR
          value: /app/.data
        - name: DEMO_MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: robotshop-demo-reviews
              key: MONGODB_URL
              optional: true
        - name: DEMO_REVIEWS_DATABASE
          value: robotshop_demo_merchant20
        - name: CART_URL
          value: http://cart-service:4107
        - name: CART_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: robotshop-secrets
              key: PAYMENT_SERVICE_TOKEN
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: robotshop-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /app/.data
        startupProbe:
          httpGet: &id001
            path: /health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          httpGet: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet: *id001
          timeoutSeconds: 3
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: gateway-data
      initContainers:
      - name: data-permissions
        image: busybox:1.38.0
        command:
        - sh
        - -ec
        - chown -R 1000:1000 /data && chmod -R u+rwX /data
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
  strategy:
    type: Recreate
