# Extended by root docker-compose.yml; run Compose from the repository root.
services:
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0-386
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - ../../observability/opentelemetry/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
    - 127.0.0.1:4318:4318
    depends_on:
    - jaeger
