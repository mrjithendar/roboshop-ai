# Extended by root docker-compose.yml; run Compose from the repository root.
services:
  sre-copilot:
    extends:
      file: ../common/compose.yml
      service: application
    image: ${IMAGE_PREFIX:-robotshop}-sre-copilot:local
    environment:
      SHIPPING_URL: http://shipping-service:4106
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4104/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
