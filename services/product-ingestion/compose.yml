# Extended by root docker-compose.yml; run Compose from the repository root.
services:
  product-ingestion:
    extends:
      file: ../common/compose.yml
      service: application
    image: ${IMAGE_PREFIX:-robotshop}-product-ingestion:${IMAGE_TAG:-local}
    environment:
      MONGODB_DATABASE: ${MONGODB_DATABASE:-robotshop}
      MONGODB_URL: mongodb://robotshop:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}@mongodb:27017/robotshop?authSource=robotshop
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      mongodb:
        condition: service_healthy
