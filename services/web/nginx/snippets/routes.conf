root "${WEB_ROOT}";
include "${NGINX_RUN_DIR}/snippets/security-headers.conf";

# Liveness checks NGINX; readiness checks the gateway core dependencies only.
location = /health { access_log off; default_type application/json; return 200 '{"status":"ok","service":"web"}'; }
include "${NGINX_RUN_DIR}/snippets/readiness.conf";
# Moks is the only public chat entry point; direct gateway chat is private.
location = /api/chat { return 403; }
location ^~ /api/ { include "${NGINX_RUN_DIR}/snippets/proxy.conf"; }
# Admin product image uploads (data URLs up to 1.5 MB); every other API body stays at 64k.
location = /api/admin/product-images { limit_except POST { deny all; } client_max_body_size 2m; include "${NGINX_RUN_DIR}/snippets/proxy.conf"; }
# Metrics stay on the private gateway service for Prometheus.
location = /metrics { return 404; }
# Storefront pages and assets come from the image's build output (see ../Dockerfile).
# Each public URL maps to one generated file; there is no SPA catch-all.
location = / { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files /index.html =404; }
location = /admin { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files /admin.html =404; }
location ~ "^/products/[a-z0-9][a-z0-9-]{0,99}$" { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files /product.html =404; }
location ~ ^/(cart|checkout)/?$ { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files /checkout.html =404; }
location ~ ^/account/?$ { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files /profile.html =404; }
location ~ ^/(login|register)/?$ { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files /auth.html =404; }
location ~ ^/(index|admin|checkout|profile|auth)\.html$ { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files $uri =404; }
location ~ ^/(admin|account|app|auth|checkout|paths|product|profile)\.js$ { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files $uri =404; }
location = /styles.css { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files $uri =404; }
location ~ ^/images/[A-Za-z0-9_-]+\.png$ { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files $uri =404; }
location ~ ^/illustrations/(robot|kit|component|accessory)\.svg$ { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files $uri =404; }
location ~ ^/fonts/inter-latin(-ext)?\.woff2$ { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files $uri =404; }
location ~ ^/product-media/[a-z0-9-]+\.(?:jpg|png)$ { include "${NGINX_RUN_DIR}/snippets/static.conf"; try_files $uri =404; }
# Missing assets, source files and private paths really return 404, never a page.
location / { return 404; }

# Optional widget: resolve at request time so its absence never prevents NGINX startup.
location ~ ^/moks/(widget\.js|available|chat|history)$ {
    set $moks_backend moks.roboshop-ai.svc.cluster.local:4103;
    rewrite ^/moks/(.*)$ /$1 break;
    proxy_pass http://$moks_backend;
    # Moks extracts only rs_auth for server-side session validation.
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;
}

# Compatibility for existing embedded widgets.
location ~ ^/finder/(widget\.js|available|chat|history)$ {
    set $finder_backend moks.roboshop-ai.svc.cluster.local:4103;
    rewrite ^/finder/(.*)$ /$1 break;
    proxy_pass http://$finder_backend;
    # Moks extracts only rs_auth for server-side session validation.
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;
}

# Optional FX: runtime DNS resolution; never part of storefront readiness.
location = /api/currency/rates {
    limit_except GET { deny all; }
    set $currency_backend currency-service.roboshop-ai.svc.cluster.local:4111;
    rewrite ^ /rates break;
    proxy_pass http://$currency_backend;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
}
