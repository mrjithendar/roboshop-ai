# Storefront files are served from this image. Methods other than GET/HEAD are refused.
limit_except GET { deny all; }
# Behind the /roboshop ingress mount, rewrite root-relative HTML attributes only.
# JavaScript resolves API and image URLs from its own module URL.
sub_filter_once off;
sub_filter 'href="/' 'href="${FRONTEND_BASE_PATH}/';
sub_filter 'src="/' 'src="${FRONTEND_BASE_PATH}/';
