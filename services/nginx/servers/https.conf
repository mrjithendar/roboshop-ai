# Optional: NGINX terminates TLS. Certificates are supplied read-only; never
# bake keys into the image. The public HTTPS port is 443.
server {
    listen ${NGINX_HTTP_PORT};
    server_name ${NGINX_SERVER_NAME};
    location = /health { return 200 'ok'; }
    location / { return 308 https://${NGINX_SERVER_NAME}$request_uri; }
}
server {
    listen ${NGINX_HTTPS_PORT} ssl;
    server_name ${NGINX_SERVER_NAME};
    ssl_certificate "${NGINX_TLS_CERT_FILE}";
    ssl_certificate_key "${NGINX_TLS_KEY_FILE}";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include "${NGINX_RUN_DIR}/snippets/routes.conf";
}
