proxy_http_version 1.1;
proxy_set_header Connection "";
# Preserve the browser's host including its port for same-origin behavior.
proxy_set_header Host $http_host;
# Replace, rather than append to, untrusted client forwarding headers.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 35s;
proxy_send_timeout 35s;
# Never automatically replay checkout/payment mutations.
proxy_next_upstream off;
proxy_cache off;
proxy_buffering off;
gzip off;
# NGINX sets these once for both its files and proxied responses.
proxy_hide_header Cache-Control;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
# Do not change request bodies or Razorpay signature headers.
# No trailing slash: /api/... and query parameters reach the gateway unchanged.
proxy_pass http://robotshop_gateway;
