# Probe only the core gateway readiness graph, never SRE's aggregate report.
location = /ready {
    access_log off;
    proxy_pass http://robotshop_gateway/api/ready;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
    proxy_send_timeout 1s;
    proxy_next_upstream off;
}
