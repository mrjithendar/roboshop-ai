root "${NGINX_WEB_ROOT}";
include "${NGINX_RUN_DIR}/snippets/security-headers.conf";

# Liveness checks NGINX; readiness checks the gateway and its dependencies.
location = /health { access_log off; default_type application/json; return 200 '{"status":"ok","service":"nginx"}'; }
location = /ready {
    include "${NGINX_RUN_DIR}/snippets/proxy.conf";
    rewrite ^ /api/ready break;
}
location ^~ /api/ { include "${NGINX_RUN_DIR}/snippets/proxy.conf"; }
# Metrics stay on the private gateway service for Prometheus.
location = /metrics { return 404; }
location = / { limit_except GET { deny all; } try_files /index.html =404; }
location = /index.html { limit_except GET { deny all; } try_files $uri =404; }
location = /admin { limit_except GET { deny all; } try_files /admin.html =404; }
location = /admin.html { limit_except GET { deny all; } try_files $uri =404; }
location = /admin.js { limit_except GET { deny all; } try_files $uri =404; }
location = /account.js { limit_except GET { deny all; } try_files $uri =404; }
location = /app.js { limit_except GET { deny all; } try_files $uri =404; }
location = /styles.css { limit_except GET { deny all; } try_files $uri =404; }
location ~ ^/images/[A-Za-z0-9_-]+\.png$ { limit_except GET { deny all; } try_files $uri =404; }
# No SPA catch-all: missing assets and private paths must really return 404.
location / { return 404; }
