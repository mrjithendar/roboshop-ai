include "${NGINX_RUN_DIR}/snippets/security-headers.conf";

# Liveness checks NGINX; readiness checks the gateway core dependencies only.
location = /health { access_log off; default_type application/json; return 200 '{"status":"ok","service":"nginx"}'; }
include "${NGINX_RUN_DIR}/snippets/readiness.conf";
# Moks is the only public chat entry point; direct gateway chat is private.
location = /api/chat { return 403; }
location ^~ /api/ { include "${NGINX_RUN_DIR}/snippets/proxy.conf"; }
# Metrics stay on the private gateway service for Prometheus.
location = /metrics { return 404; }
location = / { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location = /index.html { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location = /admin { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location = /admin.html { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location = /admin.js { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location = /account.js { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location = /app.js { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location = /styles.css { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location ~ ^/images/[A-Za-z0-9_-]+\.png$ { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
# No SPA catch-all: missing assets and private paths must really return 404.
location / { return 404; }

location ~ "^/products/[a-z0-9][a-z0-9-]{0,99}$" { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location = /product.js { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }

location = /paths.js {
    limit_except GET { deny all; }
    include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf";
}

location ~ ^/illustrations/(robot|kit|component|accessory)\.svg$ {
    limit_except GET { deny all; }
    include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf";
}

location ~ ^/product-media/[a-z0-9-]+\.(?:jpg|png)$ {
    limit_except GET { deny all; }
    include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf";
}

location ~ ^/(cart|checkout)/?$ { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }
location ~ ^/checkout\.(html|js)$ { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }

location ~ ^/(account/?|profile\.(html|js))$ { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }

# Optional widget: resolve at request time so its absence never prevents NGINX startup.
location ~ ^/moks/(widget\.js|available|chat|history)$ {
    set $moks_backend moks.roboshop-ai.svc.cluster.local:4103;
    rewrite ^/moks/(.*)$ /$1 break;
    proxy_pass http://$moks_backend;
    # Moks extracts only rs_auth for server-side session validation.
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;
}

# Compatibility for existing embedded widgets.
location ~ ^/finder/(widget\.js|available|chat|history)$ {
    set $finder_backend moks.roboshop-ai.svc.cluster.local:4103;
    rewrite ^/finder/(.*)$ /$1 break;
    proxy_pass http://$finder_backend;
    # Moks extracts only rs_auth for server-side session validation.
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;
}

location ~ ^/(login/?|register/?|auth\.(html|js))$ { limit_except GET { deny all; } include "${NGINX_RUN_DIR}/snippets/frontend-proxy.conf"; }

# Optional FX: runtime DNS resolution; never part of storefront readiness.
location = /api/currency/rates {
    limit_except GET { deny all; }
    set $currency_backend currency-service.roboshop-ai.svc.cluster.local:4111;
    rewrite ^ /rates break;
    proxy_pass http://$currency_backend;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
}
