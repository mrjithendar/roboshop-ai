# Applied at server scope, including error responses. Avoid add_header inside
# locations: it would replace these inherited headers on older NGINX versions.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header Cache-Control $cache_control always;
# Keep Razorpay checkout's scripts, frames and API connections working.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://*.razorpay.com data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://checkout.razorpay.com; connect-src 'self' https://*.razorpay.com; frame-src https://*.razorpay.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
