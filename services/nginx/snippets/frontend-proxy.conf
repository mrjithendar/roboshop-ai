proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
# Static assets need neither login cookies nor authorization credentials.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_hide_header Cache-Control;
proxy_hide_header Set-Cookie;
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
proxy_pass http://roboshop_frontend;

# Rewrite only HTML root-relative asset/navigation attributes for this mount.
# JavaScript resolves API/image URLs using the module's public URL.
proxy_set_header Accept-Encoding "";
sub_filter_once off;
sub_filter 'href="/' 'href="${FRONTEND_BASE_PATH}/';
sub_filter 'src="/' 'src="${FRONTEND_BASE_PATH}/';
