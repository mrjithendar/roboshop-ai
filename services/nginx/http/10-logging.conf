# Correlation only: the stock NGINX image has no tracing module.
map $http_traceparent $trace_id {
    default "";
    "~^00-([a-f0-9]{32})-[a-f0-9]{16}-0[01]$" $1;
}
# Log route groups instead of query strings, cookies, addresses or bodies.
map $uri $route_group {
    default static;
    ~^/api/ api;
    /health health;
    /ready readiness;
}
log_format roboshop escape=json
    '{"timestamp":"$time_iso8601","event":"request_completed","service":"nginx","requestId":"$request_id","trace_id":"$trace_id","route":"$route_group",'
    '"method":"$request_method","status":$status,"duration":$request_time,'
    '"upstreamStatus":"$upstream_status","upstreamConnectSeconds":"$upstream_connect_time","upstreamResponseSeconds":"$upstream_response_time","gatewayRequestId":"$upstream_http_x_request_id"}';
map "$route_group:$status" $log_request {
    default 1;
    "health:200" 0;
    "readiness:200" 0;
}
access_log /dev/stdout roboshop if=$log_request;
