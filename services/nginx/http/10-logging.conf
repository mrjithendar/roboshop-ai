# Log route groups instead of query strings, cookies, addresses or bodies.
map $uri $route_group {
    default static;
    ~^/api/ api;
    /health health;
    /ready readiness;
}
log_format robotshop escape=json
    '{"service":"nginx","requestId":"$request_id","route":"$route_group",'
    '"method":"$request_method","status":$status,"duration":$request_time,'
    '"upstreamStatus":"$upstream_status","gatewayRequestId":"$upstream_http_x_request_id"}';
access_log /dev/stdout robotshop;
