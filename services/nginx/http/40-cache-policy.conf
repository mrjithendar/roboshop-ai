# Browser caching only: NGINX never caches API responses.
# Assets are not fingerprinted, so use short lifetimes rather than immutable.
map $uri $asset_cache_control {
    default "no-store";
    / "no-cache";
    /index.html "no-cache";
    /app.js "public, max-age=0, must-revalidate";
    /styles.css "public, max-age=0, must-revalidate";
    ~^/images/ "public, max-age=86400";
}

# Do not cache missing files or upstream errors as successful assets.
map $status $cache_control {
    default "no-store";
    200 $asset_cache_control;
    206 $asset_cache_control;
    304 $asset_cache_control;
}
