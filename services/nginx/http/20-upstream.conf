# Refresh service DNS after gateway replacement (NGINX >= 1.27.3).
resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
resolver_timeout 3s;
upstream robotshop_gateway {
    zone gateway 256k;
    server ${GATEWAY_HOST}:${GATEWAY_PORT} resolve;
    keepalive 32;
}

upstream robotshop_frontend {
    zone frontend 256k;
    server ${FRONTEND_HOST}:${FRONTEND_PORT} resolve;
    keepalive 16;
}
