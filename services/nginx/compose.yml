# Service definition consumed by the root docker-compose.yml via extends.
# Run Compose from the repository root; paths here are relative to this directory.
services:
  nginx:
    image: ${IMAGE_PREFIX:-robotshop}-nginx:${IMAGE_TAG:-local}
    environment:
      GATEWAY_HOST: ai-gateway
      GATEWAY_PORT: '3000'
    ports:
    - 127.0.0.1:3000:8080
    depends_on:
      ai-gateway:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
