# Minikube sandbox deployment; apply with ./deploy-minikube.sh.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  selector:
    app: nginx
  ports:
  - name: p8080
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: robotshop-ai
  labels:
    app.kubernetes.io/part-of: robotshop-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/part-of: robotshop-ai
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: robotshop-nginx:local
        imagePullPolicy: IfNotPresent
        env:
        - name: FRONTEND_BASE_PATH
          value: /roboshop
        - name: GATEWAY_HOST
          value: ai-gateway
        - name: GATEWAY_PORT
          value: '3000'
        - name: FRONTEND_HOST
          value: frontend
        - name: FRONTEND_PORT
          value: '8080'
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: robotshop-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet: &id001
            path: /health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
        livenessProbe:
          httpGet: *id001
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet: *id001
          timeoutSeconds: 3
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    type: Recreate
