# Main process configuration. This runs as a non-root user on unprivileged ports.
worker_processes auto;
pid "${NGINX_RUN_DIR}/nginx.pid";
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include "${NGINX_MIME_TYPES}";
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_header_timeout 15s;
    client_body_timeout 20s;
    send_timeout 30s;
    # Match the gateway's 64 KiB webhook limit; ordinary API bodies have a
    # stricter 16 KiB limit in the gateway itself.
    client_max_body_size 64k;
    client_body_temp_path "${NGINX_RUN_DIR}/client_temp";
    proxy_temp_path "${NGINX_RUN_DIR}/proxy_temp";
    fastcgi_temp_path "${NGINX_RUN_DIR}/fastcgi_temp";
    uwsgi_temp_path "${NGINX_RUN_DIR}/uwsgi_temp";
    scgi_temp_path "${NGINX_RUN_DIR}/scgi_temp";
    include "${NGINX_RUN_DIR}/http/*.conf";
    # start.sh chooses HTTP or HTTPS; the examples are not both loaded.
    include "${NGINX_RUN_DIR}/server.conf";
}
