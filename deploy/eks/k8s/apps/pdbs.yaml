# Two-replica stateless services keep one pod through node drains and Karpenter consolidation.
# Single-replica pods (ai-gateway: single-writer JSON ledger; data stores) get maxUnavailable: 1,
# so drains are allowed but visible: those components are not highly available in this profile.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-service
