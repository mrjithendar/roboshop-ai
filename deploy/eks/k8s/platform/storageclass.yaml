# Encrypted gp3 (EBS CSI add-on). WaitForFirstConsumer creates each volume in the zone where its
# pod is first scheduled; Karpenter honours that zone for later reschedules. Retain keeps data
# when a PVC is deleted by mistake: teardown deletes volumes explicitly (RUNBOOK.md K).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  fsType: ext4
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
