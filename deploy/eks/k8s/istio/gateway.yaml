# Public entry: NLB (TCP passthrough, proxy protocol v2) -> Istio ingress gateway pods, which
# terminate TLS with the cert-manager certificate in istio-ingress/roboshop-tls.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts: ["${PUBLIC_HOST}"]
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts: ["${PUBLIC_HOST}"]
    tls:
      mode: SIMPLE
      credentialName: roboshop-tls
      minProtocolVersion: TLSV1_2
