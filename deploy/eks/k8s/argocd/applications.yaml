# One Application per rendered layer; sync waves give the dependency order
# (platform/karpenter/secrets/tls -> gatekeeper templates, istio, monitors -> apps -> constraints, keda).
# Data-bearing layers (platform: StorageClass; karpenter) never prune automatically.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: roboshop
  source:
    repoURL: ${GIT_REPO_URL}
    targetRevision: ${GIT_REVISION}
    path: deploy/eks/clusters/${CLUSTER_NAME}/platform
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
    - PruneLast=true
---
