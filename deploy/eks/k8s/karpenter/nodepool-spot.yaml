# Spot arm64 capacity for interruption-tolerant, horizontally scaled pods only. The taint keeps
# everything else off: a pod must tolerate roboshop.dev/spot to land here (shipping-worker does).
# Interruption notices arrive through the SQS queue created by terraform/karpenter.tf.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
spec:
  weight: 10
  template:
    metadata:
      labels:
        roboshop.dev/pool: spot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      taints:
      - key: roboshop.dev/spot
        value: "true"
        effect: NoSchedule
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: ["arm64"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["spot"]
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values: ["c", "m"]
      - key: karpenter.k8s.aws/instance-generation
        operator: Gt
        values: ["5"]
      - key: karpenter.k8s.aws/instance-cpu
        operator: In
        values: ["2", "4"]
      expireAfter: 168h
      terminationGracePeriod: 15m
  limits:
    cpu: "16"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
    - nodes: "20%"
