# On-Demand arm64 capacity for stateful pods, single-replica services and anything that has
# not opted into Spot. RoboShop images are linux/arm64 only, so amd64 is never requested.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  weight: 50
  template:
    metadata:
      labels:
        roboshop.dev/pool: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: ["arm64"]
      - key: kubernetes.io/os
        operator: In
        values: ["linux"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values: ["c", "m", "r"]
      - key: karpenter.k8s.aws/instance-generation
        operator: Gt
        values: ["5"]
      - key: karpenter.k8s.aws/instance-cpu
        operator: In
        values: ["2", "4", "8"]
      expireAfter: 720h
      terminationGracePeriod: 1h
  # Hard ceiling: Karpenter stops launching once the pool reaches these totals.
  limits:
    cpu: "32"
    memory: 128Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
    - nodes: "1"            # replace at most one node at a time
    - nodes: "0"            # no voluntary consolidation during the (UTC) business window
      reasons: ["Underutilized"]
      schedule: "0 9 * * mon-fri"
      duration: 8h
