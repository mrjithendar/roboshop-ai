# AWS Secrets Manager -> Kubernetes Secrets through External Secrets Operator, authenticated
# with EKS Pod Identity (terraform/iam.tf: read-only on ${SECRETS_PREFIX}/${ENVIRONMENT}/*).
# The secret JSON keys are listed in ../../scripts/put-secrets.sh. Values never enter Git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roboshop-secrets
  namespace: roboshop-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: roboshop-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
  - extract:
      key: ${SECRETS_PREFIX}/${ENVIRONMENT}/app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keda-rabbitmq
  namespace: roboshop-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keda-rabbitmq
    creationPolicy: Owner
    template:
      data:
        # Management API URL for a monitoring-tag user with no queue permissions (RUNBOOK I1).
        host: "http://keda:{{ .password | urlquery }}@rabbitmq.roboshop-ai.svc.cluster.local:15672/"
  data:
  - secretKey: password
    remoteRef:
      key: ${SECRETS_PREFIX}/${ENVIRONMENT}/app
      property: RABBITMQ_KEDA_PASSWORD
