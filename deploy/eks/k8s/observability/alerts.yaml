apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: roboshop
  namespace: monitoring
spec:
  groups:
  - name: roboshop.requests
    rules:
    - alert: RoboShopHighErrorRatio
      expr: |
        sum by (destination_workload) (rate(istio_requests_total{reporter="destination",destination_workload_namespace="roboshop-ai",response_code=~"5.."}[5m]))
          / sum by (destination_workload) (rate(istio_requests_total{reporter="destination",destination_workload_namespace="roboshop-ai"}[5m])) > 0.05
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "{{ $labels.destination_workload }}: more than 5% of requests return 5xx"
    - alert: RoboShopSlowRequests
      expr: |
        histogram_quantile(0.95, sum by (le, destination_workload) (rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_workload_namespace="roboshop-ai"}[5m]))) > 2000
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "{{ $labels.destination_workload }}: p95 latency above 2 s"
  - name: roboshop.queues
    rules:
    - alert: RoboShopShippingBacklog
      expr: max(keda_scaler_metrics_value{scaledObject="shipping-worker"}) > 100
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "roboshop.shipping.orders has more than 100 messages for 10 minutes"
    - alert: RoboShopShippingWorkerAtMax
      expr: |
        kube_horizontalpodautoscaler_status_current_replicas{namespace="roboshop-ai",horizontalpodautoscaler="keda-hpa-shipping-worker"}
          >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="roboshop-ai",horizontalpodautoscaler="keda-hpa-shipping-worker"}
      for: 15m
      labels: {severity: warning}
      annotations:
        summary: "shipping-worker is pinned at maxReplicaCount; check shipping-db capacity before raising it"
  - name: roboshop.capacity
    rules:
    - alert: RoboShopPodsPending
      expr: sum by (namespace) (kube_pod_status_phase{namespace="roboshop-ai",phase="Pending"}) > 0
      for: 15m
      labels: {severity: warning}
      annotations:
        summary: "Pods pending for 15 minutes: Karpenter limits, quotas or zone-bound volumes"
    - alert: KarpenterNodePoolNearLimit
      expr: karpenter_nodepools_usage{resource_type="cpu"} / karpenter_nodepools_limit{resource_type="cpu"} > 0.9
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "NodePool {{ $labels.nodepool }} is above 90% of its CPU limit"
  - name: roboshop.policy
    rules:
    - alert: GatekeeperDenyViolations
      expr: sum(gatekeeper_violations{enforcement_action="deny"}) > 0
      for: 15m
      labels: {severity: info}
      annotations:
        summary: "Existing resources violate enforced admission policies (gatekeeper audit)"
