# DNS-01 through Route 53 using cert-manager's Pod Identity role (terraform/iam.tf, created only
# when route53_zone_id is set). No access keys. Start with staging; switch the Certificate's
# issuerRef to letsencrypt-prod after the staging certificate is Ready.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
    - dns01:
        route53:
          region: ${AWS_REGION}
          hostedZoneID: ${ROUTE53_ZONE_ID}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
    - dns01:
        route53:
          region: ${AWS_REGION}
          hostedZoneID: ${ROUTE53_ZONE_ID}
---
# The secret must live in the gateway's namespace for credentialName to resolve.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: roboshop
  namespace: istio-ingress
spec:
  secretName: roboshop-tls
  dnsNames: ["${PUBLIC_HOST}"]
  issuerRef:
    kind: ClusterIssuer
    name: ${CERT_ISSUER}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
