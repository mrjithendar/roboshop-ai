installCRDs: true
serviceAccount:
  name: external-secrets   # Secrets Manager read-only role via Pod Identity
nodeSelector:
  roboshop.dev/pool: system
tolerations:
- key: CriticalAddonsOnly
  operator: Exists
webhook:
  nodeSelector:
    roboshop.dev/pool: system
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
certController:
  nodeSelector:
    roboshop.dev/pool: system
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
