# One identity per workload. Istio AuthorizationPolicies match these SPIFFE identities
# (cluster.local/ns/roboshop-ai/sa/<name>), and Pod Identity binds AWS roles to them.
# No workload needs the Kubernetes API, so tokens are never mounted.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalogue-service
automountServiceAccountToken: false
---
apiVersion: v1
