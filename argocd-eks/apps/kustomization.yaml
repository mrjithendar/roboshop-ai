# Hardening overlay over the manifests in services/*. Build with ../../deploy/eks/scripts/render.sh, which
# pins image digests and substitutes ${PUBLIC_HOST}, ${ENVIRONMENT}, ${OWNER} and ${IMAGE_TAG}.
# The base files live outside this directory, so the build needs --load-restrictor LoadRestrictionsNone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: roboshop-ai

resources:
- serviceaccounts.yaml
# Applications
- ../../services/web/web-deployment.yaml
- ../../services/web/web-service.yaml
- ../../services/ai-gateway/ai-gateway-deployment.yaml
- ../../services/ai-gateway/ai-gateway-service.yaml
- ../../services/ai-gateway/gateway-data-pvc.yaml
- ../../services/user-service/user-service-deployment.yaml
- ../../services/user-service/user-service-service.yaml
- ../../services/catalogue-service/catalogue-service-deployment.yaml
- ../../services/catalogue-service/catalogue-service-service.yaml
- ../../services/cart-service/cart-service-deployment.yaml
- ../../services/cart-service/cart-service-service.yaml
- ../../services/payment-service/payment-service-deployment.yaml
- ../../services/payment-service/payment-service-service.yaml
- ../../services/shipping-service/shipping-service-deployment.yaml
- ../../services/shipping-service/shipping-service-service.yaml
- ../../services/currency-service/currency-service-deployment.yaml
- ../../services/currency-service/currency-service-service.yaml
- ../../services/moks/moks-deployment.yaml
- ../../services/moks/moks-service.yaml
- ../../services/mcp-server/mcp-server-deployment.yaml
- ../../services/mcp-server/mcp-server-service.yaml
- shipping-worker.yaml
# Demo-profile data stores (single replica, EBS gp3). Production: see ../../deploy/eks/README.md#production.
- data/mongodb.yaml
- ../../services/redis/redis-deployment.yaml
- ../../services/redis/redis-service.yaml
- ../../services/rabbitmq/rabbitmq-statefulset.yaml
- ../../services/rabbitmq/rabbitmq-service.yaml
- ../../services/rabbitmq/rabbitmq-data-pvc.yaml
- ../../services/postgres/shipping-db-deployment.yaml
- ../../services/postgres/shipping-db-service.yaml
- ../../services/postgres/shipping-postgres-pvc.yaml
- ../../services/kafka-bridge/kafka-statefulset.yaml
- ../../services/kafka-bridge/kafka-service.yaml
- pdbs.yaml
- network-policies.yaml

configMapGenerator:
- name: roboshop-config
  envs:
  - config/roboshop.env
  files:
  - 10-app-user.js=config/10-app-user.js
  - 10-shipping-role.sh=../../services/postgres/10-shipping-role.sh
  - redis.conf=../../services/redis/redis.conf
  - rabbitmq.conf=../../services/rabbitmq/rabbitmq.conf
- name: mongodb-catalog
  files:
  - 20-catalog.js=../../services/mongodb/catalog.js
  options:
    disableNameSuffixHash: true

labels:
- pairs:
    app.kubernetes.io/part-of: roboshop-ai
    roboshop.dev/environment: ${ENVIRONMENT}
    roboshop.dev/owner: ${OWNER}
  includeSelectors: false
  includeTemplates: true

patches:
- target:
    kind: Deployment
    name: web
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
      template:
        spec:
          serviceAccountName: web
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: ai-gateway
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ai-gateway
    spec:
      replicas: 1
      template:
        metadata:
          annotations:
            # Istio merges these app metrics with Envoy's on :15020 (mTLS-safe scraping).
            prometheus.io/scrape: "true"
            prometheus.io/port: "3000"
            prometheus.io/path: /metrics
        spec:
          serviceAccountName: ai-gateway
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: user-service
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: user-service
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
      template:
        metadata:
          annotations:
            # Istio merges these app metrics with Envoy's on :15020 (mTLS-safe scraping).
            prometheus.io/scrape: "true"
            prometheus.io/port: "4109"
            prometheus.io/path: /metrics
        spec:
          serviceAccountName: user-service
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: catalogue-service
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: catalogue-service
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
      template:
        metadata:
          annotations:
            # Istio merges these app metrics with Envoy's on :15020 (mTLS-safe scraping).
            prometheus.io/scrape: "true"
            prometheus.io/port: "4108"
            prometheus.io/path: /metrics
        spec:
          serviceAccountName: catalogue-service
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: cart-service
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cart-service
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
      template:
        metadata:
          annotations:
            # Istio merges these app metrics with Envoy's on :15020 (mTLS-safe scraping).
            prometheus.io/scrape: "true"
            prometheus.io/port: "4107"
            prometheus.io/path: /metrics
        spec:
          serviceAccountName: cart-service
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: payment-service
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: payment-service
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
      template:
        metadata:
          annotations:
            # Istio merges these app metrics with Envoy's on :15020 (mTLS-safe scraping).
            prometheus.io/scrape: "true"
            prometheus.io/port: "4105"
            prometheus.io/path: /metrics
        spec:
          serviceAccountName: payment-service
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: shipping-service
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: shipping-service
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
      template:
        metadata:
          annotations:
            # Istio merges these app metrics with Envoy's on :15020 (mTLS-safe scraping).
            prometheus.io/scrape: "true"
            prometheus.io/port: "4106"
            prometheus.io/path: /metrics
        spec:
          serviceAccountName: shipping-service
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: currency-service
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: currency-service
    spec:
      replicas: 2
      strategy:
        type: RollingUpdate
      template:
        metadata:
          annotations:
            # Istio merges these app metrics with Envoy's on :15020 (mTLS-safe scraping).
            prometheus.io/scrape: "true"
            prometheus.io/port: "4111"
            prometheus.io/path: /metrics
        spec:
          serviceAccountName: currency-service
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: moks
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: moks
    spec:
      replicas: 1
      strategy:
        type: RollingUpdate
      template:
        metadata:
          annotations:
            # Istio merges these app metrics with Envoy's on :15020 (mTLS-safe scraping).
            prometheus.io/scrape: "true"
            prometheus.io/port: "4103"
            prometheus.io/path: /metrics
        spec:
          serviceAccountName: moks
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: mcp-server
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mcp-server
    spec:
      replicas: 1
      strategy:
        type: RollingUpdate
      template:
        spec:
          serviceAccountName: mcp-server
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
- target:
    kind: Deployment
    name: redis
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redis
    spec:
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "false"
            roboshop.dev/policy-exception: stateful-entrypoint
        spec:
          serviceAccountName: redis
- target:
    kind: StatefulSet
    name: rabbitmq
  patch: |-
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: rabbitmq
    spec:
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "false"
            roboshop.dev/policy-exception: stateful-entrypoint
        spec:
          serviceAccountName: rabbitmq
- target:
    kind: Deployment
    name: shipping-db
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: shipping-db
    spec:
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "false"
            roboshop.dev/policy-exception: stateful-entrypoint
        spec:
          serviceAccountName: shipping-db
- target:
    kind: StatefulSet
    name: kafka
  patch: |-
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: kafka
    spec:
      template:
        metadata:
          labels:
            sidecar.istio.io/inject: "false"
            roboshop.dev/policy-exception: stateful-entrypoint
        spec:
          serviceAccountName: kafka
# The Recreate strategy and single replica keep the JSON ledger single-writer (see
# services/ai-gateway/README.md). On EBS, fsGroup already makes the volume writable, so the
# root chown init container is not needed.
- target:
    kind: Deployment
    name: ai-gateway
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ai-gateway
    spec:
      template:
        spec:
          initContainers:
          - name: data-permissions
            $patch: delete
# HTTP-only shipping-service; queue consumption moved to shipping-worker.
- target:
    kind: Deployment
    name: shipping-service
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/env/12/value
      value: "false"
# The Kafka init container declares no resources; admission policy requires them.
- target:
    kind: StatefulSet
    name: kafka
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers/0/resources
      value:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 64Mi}
