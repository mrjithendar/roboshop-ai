apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: payment-service
spec:
  selector:
    matchLabels:
      app: payment-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/roboshop-ai/sa/ai-gateway
    to:
    - operation:
        ports:
        - "4105"
