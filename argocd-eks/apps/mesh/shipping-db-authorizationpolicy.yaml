apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: shipping-db
spec:
  selector:
    matchLabels:
      app: shipping-db
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/roboshop-ai/sa/shipping-location-import
        - cluster.local/ns/roboshop-ai/sa/shipping-service
    to:
    - operation:
        ports:
        - "5432"
