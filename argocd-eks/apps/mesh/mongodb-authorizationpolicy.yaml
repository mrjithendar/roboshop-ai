apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mongodb
spec:
  selector:
    matchLabels:
      app: mongodb
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/roboshop-ai/sa/ai-gateway
        - cluster.local/ns/roboshop-ai/sa/catalogue-service
        - cluster.local/ns/roboshop-ai/sa/user-service
    to:
    - operation:
        ports:
        - "27017"
