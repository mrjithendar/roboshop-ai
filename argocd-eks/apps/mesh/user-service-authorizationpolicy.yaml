apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/roboshop-ai/sa/ai-gateway
        - cluster.local/ns/roboshop-ai/sa/moks
    to:
    - operation:
        ports:
        - "4109"
