apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/roboshop-ai/sa/kafka
    to:
    - operation:
        ports:
        - "9092"
        - "9093"
