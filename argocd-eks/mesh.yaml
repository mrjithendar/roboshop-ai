# ServiceAccounts and mesh policy for roboshop-ai. Sync before the workloads that use the ServiceAccounts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-mesh
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks
  destination:
    name: roboshop-demo
    namespace: roboshop-ai
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: argocd-eks/apps/mesh
