apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-mcp-server
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks
  destination:
    name: roboshop-demo
    namespace: roboshop-ai
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  # Mesh identity: the ServiceAccount comes from tools/eks/roboshop-demo/mesh.
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: services/mcp-server
    kustomize:
      patches:
      - target:
          kind: Deployment
          name: mcp-server
        patch: |-
          - op: add
            path: /spec/template/spec/serviceAccountName
            value: mcp-server
