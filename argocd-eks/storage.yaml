apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-storage
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks
  destination:
    name: roboshop-demo
    namespace: roboshop-ai
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  # Default StorageClass for every PVC here; needs the EBS CSI add-on (see README.md).
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: deploy/eks/k8s/platform
    directory:
      include: 'storageclass.yaml'
