apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-moks
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks
  destination:
    name: roboshop-demo
    namespace: roboshop-ai
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
  # Mesh identity: the ServiceAccount comes from argocd-eks/apps/mesh.
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: services/moks
    kustomize:
      patches:
      - target:
          kind: Deployment
          name: moks
        patch: |-
          - op: add
            path: /spec/template/spec/serviceAccountName
            value: moks
