apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop-demo-postgres
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: roboshop-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  project: eks
  destination:
    name: roboshop-demo
    namespace: roboshop-ai
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
    - CreateNamespace=true
    - ServerSideApply=true
  # Removes the mk4 node pin: EBS volumes follow the pod, so EKS needs no hostname selector.
  source:
    repoURL: https://github.com/mrjithendar/roboshop-ai.git
    targetRevision: master
    path: services/postgres
    kustomize:
      patches:
      - target:
          kind: Deployment
          name: shipping-db
        patch: |-
          - op: remove
            path: /spec/template/spec/nodeSelector
